              <button onClick={handleManagerClick} className={`px-6 py-1.5 md:px-10 md:py-2 rounded-lg border border-blue-900 font-bold transition-all active:scale-90 text-sm md:text-base touch-manipulation ${isManagerMode ? 'bg-white text-blue-800 shadow' : 'bg-blue-800 text-white hover:bg-blue-900 shadow-md'}`}>
                {isManagerMode ? '저장/담당자 모드 종료' : '담당자 로그인'}
              </button>
            </div>
            <button onClick={onNavigateBack} className="absolute right-4 top-3 text-xs flex flex-col items-center font-bold p-2 rounded-lg shadow-md transition-all touch-manipulation bg-blue-800 text-white opacity-90 active:scale-95">
              <Home className="w-5 h-5 mb-1" /> 처음으로
            </button>
          </div>

          <div className="flex-1 flex flex-col p-3 md:p-8 pb-10">
            <div className="max-w-5xl w-full mx-auto bg-white rounded-xl shadow-lg overflow-hidden border flex flex-col">

              <div className="shrink-0 z-10 bg-white px-4 pt-4 pb-2 md:px-6 md:pt-6 md:pb-3 shadow-sm relative">
                <div className="bg-white rounded-xl p-3 md:p-4 border border-gray-200 flex flex-col items-center shadow-sm">
                  {saveErrorMsg && (
                    <div className="w-full mb-3 p-3 bg-red-100 text-red-700 font-bold rounded-lg border border-red-300 text-[14px] md:text-sm text-center">
                      🚨 {saveErrorMsg}
                    </div>
                  )}

                  {supabaseTableMissing && (
                    <div className="w-full mb-4 p-4 bg-amber-50 text-amber-900 rounded-xl border border-amber-300 shadow-sm text-xs sm:text-sm flex flex-col gap-2 text-left">
                      <div className="flex items-center gap-2 font-bold text-amber-800 text-[14px] sm:text-base">
                        ⚠️ 슈파베이스(Supabase) 테이블 생성이 필요합니다!
                      </div>
                      <p className="leading-relaxed">
                        평생교육실 예약 데이터를 Supabase에 완전히 이전하여 활성화하려면 아래 SQL 쿼리를 복사하여 <b>Supabase Dashboard ➡️ SQL Editor</b>에 붙여넣고 실행(Run)해 주세요.
                      </p>
                      <pre className="bg-gray-900 text-green-400 p-3 rounded-lg overflow-x-auto font-mono text-[10px] sm:text-xs max-h-40 border border-gray-800 select-all">
                        {`CREATE TABLE IF NOT EXISTS public.classroom_schedules (
    id text NOT NULL DEFAULT 'default-app-id'::text,
    data jsonb NOT NULL DEFAULT '{}'::jsonb,
    memo text NOT NULL DEFAULT ''::text,
    updated_at timestamp with time zone DEFAULT now(),
    CONSTRAINT classroom_schedules_pkey PRIMARY KEY (id)
);

ALTER TABLE public.classroom_schedules ENABLE ROW LEVEL SECURITY;

CREATE POLICY "Allow public read access" ON public.classroom_schedules FOR SELECT USING (true);
CREATE POLICY "Allow public all access" ON public.classroom_schedules FOR ALL USING (true) WITH CHECK (true);`}
                      </pre>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(`CREATE TABLE IF NOT EXISTS public.classroom_schedules (
    id text NOT NULL DEFAULT 'default-app-id'::text,
    data jsonb NOT NULL DEFAULT '{}'::jsonb,
    memo text NOT NULL DEFAULT ''::text,
    updated_at timestamp with time zone DEFAULT now(),
    CONSTRAINT classroom_schedules_pkey PRIMARY KEY (id)
);

ALTER TABLE public.classroom_schedules ENABLE ROW LEVEL SECURITY;

CREATE POLICY "Allow public read access" ON public.classroom_schedules FOR SELECT USING (true);
CREATE POLICY "Allow public all access" ON public.classroom_schedules FOR ALL USING (true) WITH CHECK (true);`);
                          alert("SQL 쿼리가 클립보드에 복사되었습니다!");
                        }}
                        className="bg-amber-600 text-white font-bold py-1.5 px-4 rounded-lg hover:bg-amber-700 active:scale-95 transition-all self-start text-xs shadow-sm"
                      >
                        SQL 쿼리 복사하기
                      </button>
                    </div>
                  )}


                  <div className="flex items-center gap-1.5 sm:gap-2 w-full max-w-md mx-auto mb-2">
                    <button onClick={() => changeWeek(-1)} className="w-10 sm:w-12 h-10 sm:h-12 flex items-center justify-center border-[1.5px] border-gray-300 rounded-xl bg-white shadow-sm hover:bg-gray-50 active:bg-gray-100 active:scale-95 touch-manipulation text-gray-700 shrink-0 transition-all">
                      <svg className="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z" /></svg>
                    </button>
                    <div className="flex-1 h-10 sm:h-12 flex items-center justify-center border-[1.5px] border-blue-400 rounded-xl bg-[#f0f7ff] text-center shadow-sm overflow-hidden px-1 transition-all">
                      <h2 className="font-extrabold text-[#1e3a8a] text-[16px] min-[360px]:text-[18px] sm:text-[20px] tracking-tighter whitespace-nowrap text-center -translate-y-[1px]">{startMonth}/{startDay} ~ {endMonth}/{endDay}</h2>
                    </div>
                    <button onClick={handleCurrentWeekClick} className="text-[13px] sm:text-[15px] px-3 sm:px-4 h-10 sm:h-12 border border-blue-600 rounded-xl font-bold bg-blue-600 text-white shadow-sm flex items-center justify-center hover:bg-blue-700 active:bg-blue-800 active:scale-95 touch-manipulation whitespace-nowrap shrink-0 transition-all">이번 주</button>
                    <button onClick={() => changeWeek(1)} className="w-10 sm:w-12 h-10 sm:h-12 flex items-center justify-center border-[1.5px] border-gray-300 rounded-xl bg-white shadow-sm hover:bg-gray-50 active:bg-gray-100 active:scale-95 touch-manipulation text-gray-700 shrink-0 transition-all">
                      <svg className="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z" /></svg>
                    </button>
                  </div>
                  <p className="text-[14px] landscape:text-xl md:text-2xl text-gray-600 text-center mt-2">
                    <span className="bg-green-200 text-green-900 font-semibold px-2 py-0.5 rounded-md">사용 가능</span>으로 표시된 시간대에 이용할 수 있습니다.
                  </p>
                </div>
              </div>

              <div
                className="flex-1 px-2 min-[360px]:px-4 pb-4 pt-2 md:px-6 md:pb-6 md:pt-3 bg-gray-50/30"
                onTouchStart={handleTouchStart}
                onTouchEnd={handleTouchEnd}
              >
                <div className="border-2 border-gray-400 rounded-lg shadow-sm overflow-hidden">
                  <table className="w-full table-fixed text-center border-collapse">
                    <thead>
                      <tr className="bg-sky-100 border-b-2 border-gray-400">
                        <th
                          onClick={toggleAll}
                          title={isManagerMode ? "클릭 시 이번 주 전체 선택/해제" : ""}
                          className={`pt-1 pb-1.5 px-0 border-r border-gray-400 font-extrabold text-gray-700 w-[14%] sm:w-28 select-none text-[11px] min-[360px]:text-[13px] landscape:text-[21px] md:text-[23px] leading-tight touch-manipulation ${isManagerMode ? 'cursor-pointer hover:bg-sky-200' : ''}`}
                        >
                          <span>시간</span><br /><span>날짜</span>
                        </th>
                        {currentDays.map((day, i) => {
                          const dateStr = formatDateString(day);
                          const isToday = dateStr === adjustedTodayStr;
                          return (
                            <th
                              key={i}
                              onClick={() => toggleWholeDay(dateStr)}
                              title={isManagerMode ? "클릭 시 해당 요일 전체 선택/해제" : ""}
                              className={`pt-0.5 pb-1.5 px-0 font-extrabold text-gray-900 select-none text-[11px] min-[360px]:text-[13px] landscape:text-[21px] md:text-[23px] leading-tight touch-manipulation tracking-tighter sm:tracking-normal ${isManagerMode ? 'cursor-pointer hover:bg-sky-200' : ''} ${isToday ? 'border-x-[4px] sm:border-x-[6px] border-t-[4px] sm:border-t-[6px] border-blue-600 relative z-10' : 'border-r border-gray-400'}`}
                            >
                              {day.getMonth() + 1}/{day.getDate()}<br className="block md:hidden" /> ({weekDays[i]})
                            </th>
                          );
                        })}
                      </tr>
                    </thead>
                    <tbody>
                      {timeSlots.map((time, ti) => (
                        <tr key={ti} className={`${ti === 2 ? 'border-b-[3px] border-gray-500' : 'border-b border-gray-400 last:border-0'}`}>
                          <td
                            onClick={() => toggleWholeWeek(time)}
                            title={isManagerMode ? "클릭 시 해당 시간대 전체 요일 선택/해제" : ""}
                            className={`p-0.5 sm:p-1.5 bg-sky-100 border-r border-gray-400 font-bold select-none text-[10px] min-[360px]:text-[11px] landscape:text-[21px] md:text-[23px] tracking-tighter sm:tracking-normal touch-manipulation ${ti >= 3 ? 'text-orange-600' : 'text-blue-700'} ${isManagerMode ? 'cursor-pointer hover:bg-sky-200' : ''}`}
                          >
                            <div className="block sm:hidden leading-none">{time.split(' - ')[0]}<br />~<br />{time.split(' - ')[1]}</div>
                            <div className="hidden sm:block">{time}</div>
                          </td>
                          {currentDays.map((day, di) => {
                            const dateStr = formatDateString(day);
                            const key = getScheduleKey(dateStr, time);
                            const state = schedule[key];
                            const isToday = dateStr === adjustedTodayStr;
                            const isLastRow = ti === timeSlots.length - 1;

                            const cellBg = state === true ? 'bg-green-200' : state === 'nangman' ? 'bg-blue-600' : state === 'pending' ? 'bg-gray-300' : 'bg-pink-50';
                            const textCol = state === true ? 'text-green-900' : state === 'nangman' ? 'text-white' : state === 'pending' ? 'text-gray-800' : 'text-pink-800';
                            const cellPadding = state === 'nangman' ? 'px-0 py-1' : 'p-0.5 sm:p-2';
                            const cellContent = state === true ? <>사용<br />가능</> : state === 'nangman' ? <span className="block whitespace-nowrap -mx-1 tracking-tighter" style={{ letterSpacing: '-1px' }}>낭만<br /><span className="text-[9px] min-[360px]:text-[10px] landscape:text-[17px] md:text-[18px]">스튜디오</span></span> : state === 'pending' ? <span>미정</span> : <>사용<br />불가</>;

                            return (
                              <td key={di} onClick={() => toggleAvailability(dateStr, time)}
                                className={`${cellPadding} transition-all h-10 min-[360px]:h-12 md:h-16 touch-manipulation ${isManagerMode ? 'cursor-pointer hover:brightness-95 active:scale-95' : 'cursor-default'} ${cellBg} ${isToday ? (isLastRow ? 'border-x-[4px] sm:border-x-[6px] border-b-[4px] sm:border-b-[6px] border-blue-600 relative z-10' : 'border-x-[4px] sm:border-x-[6px] border-blue-600 relative z-10') : 'border-r border-gray-400'}`}>
                                <span className={`text-[12px] min-[360px]:text-[13px] landscape:text-[22px] md:text-[24px] leading-tight inline-block font-semibold ${textCol}`}>

                <div className="mt-6 bg-gray-100 p-4 rounded-xl border border-gray-200 shadow-inner">
                  <h3 className="font-bold text-gray-700 mb-2 flex items-center gap-2 text-sm landscape:text-[20px] md:text-[22px]">📢 공지 및 메모</h3>
                  <textarea
                    value={memo}
                    onChange={(e) => {
                      if (!isManagerMode) return;
                      setMemo(e.target.value);
                      setIsTyping(true);

                    }}
                    readOnly={!isManagerMode}
                    placeholder={isManagerMode ? "모든 선생님 화면에 실시간으로 보입니다." : "담당자 모드에서만 작성 가능합니다."}
                    className={`w-full p-3 md:p-4 border rounded-xl font-bold h-24 md:h-32 outline-none transition-all text-sm landscape:text-[20px] md:text-[22px] text-black bg-white ${isManagerMode ? 'border-blue-300' : 'border-gray-300'}`}
                  />
                  {isTyping && <div className="text-[10px] text-blue-500 mt-1 font-bold animate-pulse text-right">자동 저장 중...</div>}

          </div>

          {showPwdModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4 backdrop-blur-sm">

          const isShowHeadcount = (studentStr.includes("보조강사") || studentStr.includes("경로당")) && studentNames.length < 2;

          studentNames.forEach((name, idx) => {
            const isAssistant = name.includes("보조강사");
            if (isAssistant && !statusStr) return;

            let studentStatus = (statusParts.length > idx) ? statusParts[idx].trim() : statusParts[0].trim();

        return insights.length > 0 ? insights : ["현재 기록된 데이터로 보아 기초 디지털 역량 강화에 집중하고 있는 시기입니다."];
      }, [categorized, attendanceStats, team, contents]);

      if (contents.length === 0 && (!attendanceStats || attendanceStats.total === 0)) {

      useEffect(() => {
        document.documentElement.style.overscrollBehaviorY = 'auto';
        document.body.style.overscrollBehaviorY = 'auto';
      }, []);

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        if (touchStartX.current === null || touchStartY.current === null) return;

        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const deltaX = touchStartX.current - touchEndX;
        const deltaY = touchStartY.current - touchEndY;

        if (isLoading) {
          touchStartX.current = null;
          touchStartY.current = null;
          return;
        }

        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 150) {
          if (deltaX > 0) handleDateChange(1);
          else handleDateChange(-1);
        }

        touchStartX.current = null;
        touchStartY.current = null;
      };

      const fetchTeamData = useCallback(async (teamName, displayDate) => {
        if (!teamName) return;
        setIsLoading(true);
        setScheduleData([]);
        setNotice("");

        try {
          const dateStr = getLocalDateString(displayDate);
          // Supabase에서 해당 날짜, 해당 팀의 최신 레코드 페치
          const { data: supabaseRecords, error: supabaseError } = await window.supabaseClient
            .from('daily_logs')
            .select('*')
            .eq('team', teamName)
            .eq('log_date', dateStr);

          if (supabaseError) throw supabaseError;

          const records = supabaseRecords || [];

          if (records.length === 0) {
            setScheduleData([]);
            setNotice(`⚠️ 해당 날짜(${dateStr})의 일지 데이터가 없습니다.`);
            setIsLoading(false);
            return;
          }

          // 레코드를 바탕으로 parsedData 배열 구성
          const parsedData = records.map(r => {
            let group = "기타";
            if (TEACHER_GROUPS[teamName] && TEACHER_GROUPS[teamName][r.teacher]) {
              group = TEACHER_GROUPS[teamName][r.teacher];
            }

            return {
              group: group,
              teacher: r.teacher,
              time: r.shift,
              student: r.student || "",
              status: r.status || "",
              location: r.signature_url || r.location || "",
              sessionCounts: null,
              isSpecial: false
            };
          });

          // 💡 조(Group) -> 선생님(TEACHER_GROUPS 공식 조별/선생님 순서) -> 시간(Shift) 순으로 정렬
          parsedData.sort((a, b) => {
            const weightA = getGroupWeight(a.group);
            const weightB = getGroupWeight(b.group);
            if (weightA !== weightB) return weightA - weightB;

            if (a.teacher !== b.teacher) {
              return getTeacherSortWeight(teamName, a.teacher) - getTeacherSortWeight(teamName, b.teacher);
            }

            return getShiftWeight(a.time) - getShiftWeight(b.time);
          });

          for (let i = 0; i < parsedData.length; i++) {
            parsedData[i].rowspan = { group: 1, teacher: 1, time: 1 };
            parsedData[i].render = { group: true, teacher: true, time: true };
          }

          const colsToMerge = ['group', 'teacher', 'time'];
          for (let c = 0; c < colsToMerge.length; c++) {
            const col = colsToMerge[c];
            let startRow = 0;
            while (startRow < parsedData.length) {
              let count = 1;
              for (let nextRow = startRow + 1; nextRow < parsedData.length; nextRow++) {
                let sameAsParent = true;
                for (let p = 0; p < c; p++) {
                  if (parsedData[startRow][colsToMerge[p]] !== parsedData[nextRow][colsToMerge[p]]) {
                    sameAsParent = false;
                    break;
                  }
                }
                if (sameAsParent && parsedData[startRow][col] === parsedData[nextRow][col]) {
                  count++;
                  parsedData[nextRow].render[col] = false;
                } else {
                  break;
                }
              }
              parsedData[startRow].rowspan[col] = count;
              startRow += count;
            }
          }

          setScheduleData(parsedData);
        } catch (error) {
          console.error("데이터 로드 에러:", error);
          setNotice("⚠️ 데이터를 가져오지 못했습니다.");
        } finally {
          setIsLoading(false);
          setIsInitialLoad(false);
        }
      }, []);

      useEffect(() => {
        fetchTeamData(selectedTeam, currentDisplayDate);
      }, [selectedTeam, currentDisplayDate, fetchTeamData]);

      const handleDateChange = (daysToAdd) => {
        let tempDate = new Date(currentDisplayDate);
        do {
          tempDate.setDate(tempDate.getDate() + daysToAdd);
        } while (tempDate.getDay() === 0 || tempDate.getDay() === 6);
        tempDate.setHours(0, 0, 0, 0);
        setCurrentDisplayDate(tempDate);
        setNotice("");
      };

      const handleToday = () => {
        let d = new Date();
        d.setHours(0, 0, 0, 0);
        if (d.getDay() === 6) d.setDate(d.getDate() + 2);
        else if (d.getDay() === 0) d.setDate(d.getDate() + 1);
        setCurrentDisplayDate(d);
        setNotice("");
      };

      const handleDatePick = (e) => {
        if (!e.target.value) return;
        const parts = e.target.value.split('-');
        const selectedDate = new Date(parts[0], parseInt(parts[1]) - 1, parts[2]);
        selectedDate.setHours(0, 0, 0, 0);
        setCurrentDisplayDate(selectedDate);
        setNotice("");
      };

      const y = currentDisplayDate.getFullYear();
      const m = String(currentDisplayDate.getMonth() + 1).padStart(2, '0');
      const d = String(currentDisplayDate.getDate()).padStart(2, '0');
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const day = dayNames[currentDisplayDate.getDay()];
      const datePickerValue = `${y}-${m}-${d}`;

      return (
        <div className="min-h-[100dvh] flex flex-col bg-transparent font-sans text-gray-800 overflow-y-auto">
          <div className="shrink-0 bg-[#2b5ce6] text-white shadow-md z-40 relative">
            <div className="max-w-5xl mx-auto px-4 pb-4 pt-safe-4 flex justify-between items-start">
              <div>
                <div className="flex items-center mb-1">
                  <img src="Logo_of_Seoul.jpg" alt="서울시 로고" className="h-7 bg-white px-2 py-1 rounded-md object-contain mr-2" onError={(e) => e.target.style.display = 'none'} />
                  <h1 className="font-black text-xl leading-tight">성동노인종합복지관</h1>
                </div>
                <p className="text-lg font-bold text-yellow-300 mb-1">디지털교육 서포터즈</p>
              </div>
              <button onClick={onNavigateBack} className="text-xs flex flex-col items-center font-bold p-2 rounded-lg shadow-md transition-all touch-manipulation bg-blue-800 text-white opacity-90 active:scale-95">
                <Home className="w-5 h-5 mb-1" /> 처음으로
              </button>
            </div>
          </div>

          <div className="flex-1 flex flex-col pb-0">
            <div className="max-w-5xl w-full mx-auto flex-1 flex flex-col p-3 md:p-6 pb-0 mt-2">
              <div className="bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col overflow-hidden">

                <div className="shrink-0 z-30 bg-white px-4 md:px-6 pt-4 md:pt-6 pb-4 shadow-[0_4px_10px_-2px_rgba(0,0,0,0.1)] relative">

                  <div className="flex flex-row flex-wrap items-center justify-between gap-2 mb-0 border-b border-gray-100 pb-0.5 w-full">
                    <h2 className="text-[16px] min-[360px]:text-[18px] landscape:text-[22px] md:text-xl font-bold flex items-center gap-1 md:gap-2 text-gray-800 whitespace-nowrap min-w-0 tracking-tighter sm:tracking-normal">
                      <LucideCalendar className="w-4 h-4 md:w-5 md:h-5 text-blue-500" />
                      오늘의 수업 일정
                    </h2>

                    <div className="flex border border-gray-300 rounded-lg overflow-hidden shadow-sm shrink-0 ml-auto">
                      {["1팀", "2팀", "3팀", "취업팀"].map(team => (
                        <button key={team} onClick={() => {
                          setSelectedTeam(team);
                          if (onTeamChange) onTeamChange(team);
                        }} className={`px-1 min-[360px]:px-2 md:px-4 py-1 md:py-1.5 border-r border-gray-300 text-[11px] min-[360px]:text-[13px] landscape:text-[18px] md:text-lg font-semibold tracking-tighter transition last:border-r-0 ${selectedTeam === team ? 'bg-[#2b5ce6] text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}`}>
                          {team}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="text-center min-h-[18px] mt-0 mb-0.5 flex items-center justify-center">
                    {isLoading ? (
                      <div className="flex items-center justify-center text-[#DC2626] font-bold text-sm md:text-base animate-pulse tracking-tight">
                        <Clock className="w-5 h-5 md:w-6 md:h-6 mr-1.5 animate-spin" />
                        최신 데이터 확인 중...
                      </div>
                    ) : notice ? (
                      <span className="text-red-500 text-sm md:text-base font-bold">{notice}</span>
                    ) : null}
                  </div>

                  <div className="flex items-center gap-1.5 sm:gap-2 w-full max-w-md mx-auto">
                    <button onClick={() => handleDateChange(-1)} className="w-10 sm:w-12 h-10 sm:h-12 flex items-center justify-center border-[1.5px] border-gray-300 rounded-xl bg-white shadow-sm hover:bg-gray-50 active:bg-gray-100 active:scale-95 touch-manipulation text-gray-700 shrink-0 transition-all">
                      <svg className="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z" /></svg>
                    </button>

                    <div className="flex-1 h-10 sm:h-12 relative flex items-center justify-center border-[1.5px] border-blue-400 rounded-xl bg-[#f0f7ff] text-center shadow-sm overflow-hidden transition-all">
                      <input
                        type="date"
                        value={datePickerValue}
                        onChange={handleDatePick}
                        onClick={(e) => {
                          try {
                            if (e.target.showPicker) e.target.showPicker();
                          } catch (err) { }
                        }}
                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                        title="달력 열기"
                      />
                      <div className={`flex items-center justify-center pointer-events-none relative z-0 -translate-y-[1px] whitespace-nowrap px-1`}>
                        <span className="font-extrabold text-[#1e3a8a] text-[15px] min-[360px]:text-[17px] landscape:text-[22px] sm:text-[20px] tracking-tighter whitespace-nowrap">{currentDisplayDate.getMonth() + 1}/{currentDisplayDate.getDate()}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="mx-1 sm:mx-1.5 w-4 h-4 sm:w-5 sm:h-5 shrink-0">
                          <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                          <line x1="16" x2="16" y1="2" y2="6" />
                          <line x1="8" x2="8" y1="2" y2="6" />
                          <line x1="3" x2="21" y1="10" y2="10" />
                        </svg>
                        <span className="font-extrabold text-[#1e3a8a] text-[15px] min-[360px]:text-[17px] landscape:text-[22px] sm:text-[20px] tracking-tighter whitespace-nowrap shrink-0">({day})</span>
                      </div>
                    </div>

                    <button onClick={handleToday} className="text-[13px] sm:text-[15px] px-3 sm:px-4 h-10 sm:h-12 border border-blue-600 rounded-xl font-bold bg-blue-600 text-white shadow-sm flex items-center justify-center hover:bg-blue-700 active:bg-blue-800 active:scale-95 touch-manipulation whitespace-nowrap shrink-0 transition-all">오늘</button>
                    <button onClick={() => handleDateChange(1)} className="w-10 sm:w-12 h-10 sm:h-12 flex items-center justify-center border-[1.5px] border-gray-300 rounded-xl bg-white shadow-sm hover:bg-gray-50 active:bg-gray-100 active:scale-95 touch-manipulation text-gray-700 shrink-0 transition-all">
                      <svg className="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z" /></svg>
                    </button>
                  </div>
                </div>

                <div
                  className="flex-1 flex flex-col overflow-hidden px-4 md:px-6 pb-4 md:pb-6 pt-3 bg-gray-50/30"
                  onTouchStart={handleTouchStart}
                  onTouchEnd={handleTouchEnd}
                >
                  <div className="bg-white rounded-xl shadow-sm border border-gray-400 w-full flex-1 flex flex-col overflow-hidden">
                    <div className="overflow-auto relative rounded-xl flex-1">
                      <table className="w-full table-fixed text-center border-collapse">
                        <thead className="sticky top-0 z-20 shadow-md outline outline-1 outline-blue-500">
                          <tr className="bg-blue-600 text-white text-sm landscape:text-[17px] md:text-base leading-normal">
                            <th className="border border-blue-500 py-1.5 px-1 md:py-2 md:px-4 font-semibold w-[10%] md:w-[10%] break-keep bg-blue-600">조</th>
                            <th className="border border-blue-500 py-1.5 px-1 md:py-2 md:px-4 font-semibold w-[20%] md:w-[18%] break-keep sticky left-0 z-30 bg-blue-600 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.2)]">선생님</th>
                            <th className="border border-blue-500 py-1.5 px-1 md:py-2 md:px-4 font-semibold w-[17%] md:w-[18%] break-keep bg-blue-600">시간</th>
                            <th className="border border-blue-500 py-1.5 px-1 md:py-2 md:px-2 font-semibold w-[37%] md:w-[38%] break-keep bg-blue-600 text-white">학생(장소)</th>
                            <th className="border border-blue-500 py-1.5 px-1 md:py-2 md:px-2 font-semibold w-[16%] md:w-[16%] break-keep bg-blue-600 text-white">회차</th>
                          </tr>
                        </thead>
                        <tbody className="text-gray-700 text-xs md:text-sm">
                          {scheduleData.length === 0 ? (
                            <tr><td colSpan="5" className="border border-gray-300 py-6 text-center bg-white"></td></tr>
                          ) : (
                            scheduleData.map((row, index) => {
                              const isNewTeacher = index > 0 && row.render.teacher;
                              const topBorderStyle = isNewTeacher ? { borderTop: '2px solid #9ca3af' } : {};

                              const tdClass = "border border-gray-400 py-1 px-1 md:py-1.5 md:px-3 align-middle break-keep";

                              let statusColorClass = "text-black font-bold";
                              if (row.status) {
                                const hasAbsenceOrCancel = row.status.includes("결석") || row.status.includes("취소");
                                const hasVacation = row.status.includes("휴가");
                                if (hasAbsenceOrCancel) {
                                  statusColorClass = "text-red-600 font-bold";
                                } else if (hasVacation) {
                                  statusColorClass = "text-gray-800 font-bold";
                                }
                              }

                              let locationTextClass = "text-gray-700";
                              if (row.location && row.location.length >= 4) {
                                locationTextClass = "text-gray-700 text-[10px] md:text-xs tracking-tighter";
                              }

                              let studentCellBg = "";
                              const combinedText = (row.student || "") + " " + (row.location || "");
                              if (row.isSpecial || combinedText.includes("공휴일") || combinedText.includes("간담회")) {
                                studentCellBg = "bg-red-200";
                              } else if (combinedText.includes("보조강사")) {
                                studentCellBg = "bg-[#FFFF00]";
                              } else if (combinedText.includes("경로당") || combinedText.includes("도선복지관")) {
                                studentCellBg = "bg-orange-100";
                              } else {
                                const pinkLocs = ["방문", "사근복지관", "삼부", "성원"];
                                if (row.location && pinkLocs.some(loc => row.location.includes(loc))) {
                                  studentCellBg = "bg-pink-100";
                                }
                              }

                              const locTextForDisplay = row.location ? row.location.trim() : "";
                              const isLocationUrl = locTextForDisplay && (locTextForDisplay.startsWith('http') || locTextForDisplay.startsWith('//') || locTextForDisplay.startsWith('data:') || locTextForDisplay.includes('drive.google.com'));
                              const showLocationText = locTextForDisplay && locTextForDisplay !== "복지관" && !(row.student || "").includes("보조강사") && selectedTeam !== '취업팀' && !isLocationUrl;

                              const hasKiosk = ((row.student || "") + (locTextForDisplay)).includes("키오스크");
                              const studentNames = (row.student || "").split(/[/,]/).map(s => s.trim()).filter(Boolean);
                              const isMultipleStudents = studentNames.length >= 2;
                              const stuLen = (row.student || "").length;

                              let dynamicStuSizeClass = hasKiosk ? "text-[15px] md:text-[16px] landscape:text-[19px]" : "text-[16px] md:text-[18px] landscape:text-[20px]";
                              if (stuLen >= 9) {
                                dynamicStuSizeClass = "text-[12px] min-[360px]:text-[13px] md:text-[15px] landscape:text-[17px] tracking-tighter";
                              } else if (stuLen >= 6) {
                                dynamicStuSizeClass = "text-[14px] min-[360px]:text-[15px] md:text-[16px] landscape:text-[18px] tracking-tight";
                              }

                              return (
                                <tr key={index} className="border-b border-gray-400 hover:bg-blue-50 transition bg-white">
                                  {row.render.group && <td className={`${tdClass} font-medium text-gray-800 text-[1.2em] landscape:text-[1.5em]`} rowSpan={row.rowspan.group} style={topBorderStyle}>{typeof row.group === 'string' ? row.group.replace('조', '').trim() : row.group}</td>}

                                  {row.render.teacher && (
                                    <td className={`${tdClass} bg-blue-100 font-bold text-gray-900 text-[16px] landscape:text-[20px] md:text-[18px] sticky left-0 z-10 shadow-[2px_0_4px_-2px_rgba(0,0,0,0.1)]`} rowSpan={row.rowspan.teacher} style={topBorderStyle}>
                                      {typeof row.teacher === 'string' ? (
                                        row.teacher.trim().split(/\s+/).map((namePart, idx) => (
                                          <div key={idx} className="leading-tight whitespace-nowrap">{namePart}</div>
                                        ))
                                      ) : (
                                        <div className="leading-tight whitespace-nowrap">{row.teacher}</div>
                                      )}
                                    </td>
                                  )}

                                  {row.render.time && (
                                    <td className={`${tdClass} text-gray-700 text-[14px] landscape:text-[18px] md:text-[17px] tracking-tighter`} rowSpan={row.rowspan.time} style={topBorderStyle}>
                                      {typeof row.time === 'string' && row.time.includes('~') ? (
                                        <>
                                          {(() => {
                                            let displayTime = row.time;
                                            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                                            const dayStr = dayNames[currentDisplayDate.getDay()];
                                            if (selectedTeam === '취업팀' && dayStr === '금') {
                                              const mapping = { "13:00~14:00": "9:30~10:30", "14:00~15:00": "10:30~11:30", "15:00~16:00": "11:30~12:30" };
                                              displayTime = mapping[row.time] || row.time;
                                            }
                                            return (
                                              <>
                                                <div className="flex md:hidden landscape:hidden w-full justify-center items-center leading-tight whitespace-nowrap">
                                                  {displayTime.split('~')[0].trim()}~
                                                </div>
                                                <div className="hidden md:flex landscape:flex w-full justify-center items-center leading-tight whitespace-nowrap text-center">
                                                  {displayTime.replace(/\s+/g, '')}
                                                </div>
                                              </>
                                            );
                                          })()}
                                        </>
                                      ) : (
                                        <div className="flex w-full justify-center items-center whitespace-nowrap text-center">{row.time}</div>
                                      )}
                                    </td>
                                  )}

                                  <td className={`${tdClass} ${studentCellBg}`} style={topBorderStyle}>
                                    <div className={`font-bold text-blue-600 ${dynamicStuSizeClass} leading-[1.1] w-full flex flex-col items-center justify-center`}>
                                      <span className="whitespace-nowrap text-center">{(row.student || "").replace(/\n/g, ' ')}</span>
                                      {showLocationText && !locTextForDisplay?.startsWith('http') && !locTextForDisplay?.startsWith('data:') && (
                                        <span className="whitespace-nowrap text-center mt-0.5 font-medium text-gray-500 text-[1.0em]">({locTextForDisplay})</span>
                                      )}
                                    </div>
                                    <div className={`text-[14px] landscape:text-[18px] md:text-[16px] ${statusColorClass} mt-1 whitespace-normal break-words break-keep leading-tight text-center`}>
                                      {row.status}
                                      {/* [수정] 취업팀인 경우 이미지가 있다면 표시 (URL 텍스트는 제거) */}
                                    </div>

                                    {/* 싸인 표시 (취업팀 전용) */}
                                    {(selectedTeam?.trim() === '취업팀' || selectedTeam?.toLowerCase().includes('취업')) && row.location && (row.location.toLowerCase().startsWith('http') || row.location.toLowerCase().startsWith('data:') || row.location.toLowerCase().includes('drive.google.com') || row.location.toLowerCase().startsWith('=image')) && (
                                      <div className="mt-2 w-full flex flex-col items-center">
                                        <div className="relative overflow-hidden rounded-lg border border-blue-400 shadow-sm bg-pink-50 p-1">
                                          <img
                                            src={getDirectImageUrl(row.location)}
                                            alt="Sign"
                                            className={`${isMultipleStudents ? 'h-28 sm:h-32' : 'h-14 sm:h-16'} w-auto object-contain mix-blend-multiply`}
                                            onError={(e) => { e.target.closest('div').style.display = 'none'; }}
                                          />
                                        </div>
                                      </div>
                                    )}
                                  </td>

                                  <td className={`${tdClass} font-bold text-center text-[13px] landscape:text-[16px] md:text-[15px] transition-colors`} style={topBorderStyle}>
                                    {row.sessionCounts && !row.student?.includes("간담회") ? (
                                      <div className="flex flex-col w-full justify-center items-center gap-1">
                                        {row.sessionCounts.map((sc, scIdx) => {
                                          let sessionCellBg = "bg-gray-300";
                                          let sessionTextCol = "text-black";

                                          if (sc.count >= 10) {
                                            sessionCellBg = "bg-purple-900";
                                            sessionTextCol = "text-white";
                                          } else if (sc.count >= 7) {
                                            sessionCellBg = "bg-purple-400";
                                            sessionTextCol = "text-white";
                                          }

                                          return (
                                            <div key={scIdx} onClick={() => setSelectedStudentDates(sc)} className={`px-1.5 py-0.5 rounded w-full whitespace-nowrap ${sessionCellBg} ${sessionTextCol} shadow-sm cursor-pointer hover:brightness-95 active:scale-95 transition-all`}>
                                              {sc.count}회차
                                            </div>
                                          );
                                        })}
                                      </div>
                                    ) : (
                                      <span className="text-purple-700">-</span>
                                    )}
                                  </td>
                                </tr>
                              );
                            })
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>

                <SummarySection
                  data={scheduleData}
                  date={currentDisplayDate}
                  team={selectedTeam}
                  onTouchStart={handleTouchStart}
                  onTouchEnd={handleTouchEnd}
                />

              </div>
            </div>
          </div>

          {selectedStudentDates && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] px-2 sm:px-4" onClick={() => setSelectedStudentDates(null)}>
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-xl overflow-hidden flex flex-col max-h-[80vh] animate-fadeIn" onClick={e => e.stopPropagation()}>
                <div className="bg-purple-600 text-white py-3 px-4 flex justify-between items-center shrink-0">
                  <h3 className="font-bold text-[18px] sm:text-[20px]">{selectedStudentDates.name}님의 출석 일자 <span className="text-purple-200 text-[15px] sm:text-[16px]">({selectedStudentDates.count}회)</span></h3>
                  <button onClick={() => setSelectedStudentDates(null)} className="text-white hover:text-gray-200 active:scale-90 transition-transform">
                    <svg className="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                  </button>
                </div>
                <div className="p-3 sm:p-4 overflow-y-auto">
                  <div className="grid grid-cols-4 gap-2 sm:gap-3">
                    {selectedStudentDates.dates.map((d, idx) => {
                      const today = new Date();
                      const isToday = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
                      return (
                        <div key={idx} className={`${isToday ? 'bg-purple-300 border-purple-500 shadow-md text-purple-950' : 'bg-purple-50 border-purple-200 shadow-sm text-purple-900'} rounded-lg py-2.5 sm:py-3 px-0.5 sm:px-1 text-center text-[13.5px] min-[360px]:text-[15.5px] sm:text-[18px] font-bold flex justify-center items-center whitespace-nowrap tracking-tighter sm:tracking-normal`}>
                          {d.getMonth() + 1}/{d.getDate()} ({['일', '월', '화', '수', '목', '금', '토'][d.getDay()]})
                        </div>
                      );
                    })}
                  </div>
                  {selectedStudentDates.dates.length === 0 && (
                    <div className="text-center text-gray-500 py-4 font-bold text-[16px] sm:text-[18px]">출석 기록이 없습니다.</div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // =====================================================================
    // 🔍 대상자 검색 컴포넌트
    // =====================================================================
    function StudentSearchApp({ onNavigateBack }) {
      const [allRecords, setAllRecords] = useState([]);
      const [teamFilter, setTeamFilter] = useState("전체");
      const [selectedName, setSelectedName] = useState("");
      const [isLoading, setIsLoading] = useState(true);
      const [loadProgress, setLoadProgress] = useState("");
      const [teacherListByTeam, setTeacherListByTeam] = useState({});
      const [teacherFilter, setTeacherFilter] = useState("전체");
      const [searchTerm, setSearchTerm] = useState("");
      const [recentSearches, setRecentSearches] = useState(() => {
        try {
          const saved = localStorage.getItem('sungdong_recent_searches');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });

      const getSearchChoSung = (name) => {
        if (!name) return "";
        return name.split('').map(char => {
          const charCode = char.charCodeAt(0);
          if (charCode < 0xAC00 || charCode > 0xD7A3) return char;
          const choIndex = Math.floor(((charCode - 0xAC00) / 28) / 21);
          const choList = ["ㄱ", "ㄱ", "ㄴ", "ㄷ", "ㄷ", "ㄹ", "ㅁ", "ㅂ", "ㅂ", "ㅅ", "ㅅ", "ㅇ", "ㅈ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
          return choList[choIndex];
        }).join('');
      };

      const currentTeamNames = useMemo(() => {
        let records = allRecords;
        if (teamFilter !== "전체") {
          records = allRecords.filter(r => r.team === teamFilter);
        }
        if (teacherFilter !== "전체") {
          records = records.filter(r => r.teacher === teacherFilter);
        }
        const nameSet = new Set();
        records.forEach(r => nameSet.add(r.name));
        return Array.from(nameSet).sort((a, b) => a.localeCompare(b, 'ko'));
      }, [allRecords, teamFilter, teacherFilter]);

      const filteredNames = useMemo(() => {
        if (searchTerm.trim() === "") return currentTeamNames;

        const lowerSearch = searchTerm.toLowerCase().replace(/\s+/g, '');
        return currentTeamNames.filter(name => {
          const normalizedName = name.toLowerCase().replace(/\s+/g, '');
          const choName = getSearchChoSung(name);
          return normalizedName.includes(lowerSearch) || choName.includes(lowerSearch);
        });
      }, [currentTeamNames, searchTerm]);

      const ATTENDANCE_TAGS = ['1', '결석', '취소', '선생님휴가'];

      useEffect(() => {
        document.documentElement.style.overscrollBehaviorY = 'auto';
        document.body.style.overscrollBehaviorY = 'auto';
      }, []);

      useEffect(() => {
        const loadAll = async () => {
          setIsLoading(true);
          try {
            setLoadProgress("전체 데이터 로딩 중...");
            const teams = ["1팀", "2팀", "3팀", "취업팀", "기타참여자"];
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            // Supabase 1000개 제한을 우회하기 위해 range pagination을 사용하여 모든 레코드를 누락 없이 완벽히 가져옴
            const fetchTeamRecords = async (teamName) => {
              let allData = [];
              let from = 0;
              const step = 1000;
              let hasMore = true;

              while (hasMore) {
                const to = from + step - 1;
                const { data, error } = await window.supabaseClient
                  .from('daily_logs')
                  .select('*')
                  .eq('team', teamName)
                  .neq('student', '')
                  .not('student', 'is', null)
                  .lte('log_date', todayStr) // 오늘까지 수업이 있는 사람들만 읽어옴
                  .order('log_date', { ascending: false }) // 최신 데이터를 우선하여 가져옴
                  .range(from, to);

                if (error) throw error;
                if (data && data.length > 0) {
                  allData = allData.concat(data);
                  if (data.length < step) {
                    hasMore = false;
                  } else {
                    from += step;
                  }
                } else {
                  hasMore = false;
                }
              }
              return allData;
            };

            const queryPromises = teams.map(teamName => fetchTeamRecords(teamName));
            const results = await Promise.all(queryPromises);

            let records = [];
            results.forEach((teamRecords) => {
              if (teamRecords) records = records.concat(teamRecords);
            });

            console.log("DB Unique Teams:", [...new Set((records || []).map(r => r.team))]);
            console.log("DB Total Records Count:", (records || []).length);

            const teachersByTeam = {
              "1팀": [],
              "2팀": [],
              "3팀": [],
              "취업팀": [],
              "기타참여자": []
            };

            const allParsed = [];

            if (records) {
              records.forEach(row => {
                if (!row.student) return;

                // 해당 행의 교사와 팀 매핑
                if (row.teacher && row.team && teachersByTeam[row.team]) {
                  if (!teachersByTeam[row.team].includes(row.teacher)) {
                    teachersByTeam[row.team].push(row.teacher);
                  }
                }

                // 여러 학생이 콤마/슬래시로 구분된 경우
                const names = row.student.split(/[/,]/).map(s => s.trim().split('(')[0].trim()).filter(Boolean);

                names.forEach((name, nameIdx) => {
                  const excludeKeywords = ["보조강사", "자체학습", "대상자발굴", "도선복지관", "소양교육", "간담회", "수업", "준비", "컴기초", "공휴일", "근로자의날", "근로자의 날", "삼일절", "3.1절", "어린이날", "현충일", "광복절", "개천절", "한글날", "석가탄신일", "부처님오신날", "성탄절", "제헌절", "추석", "설날", "신정", "대체공휴일", "지방선거일", "지방 선거일", "선거일"];
                  if (excludeKeywords.some(keyword => name.includes(keyword))) return;

                  // 출결 태그 분리 및 매핑
                  let personalStatus = row.status || "";
                  if (personalStatus.includes('/')) {
                    const segments = personalStatus.split('/');
                    if (segments.length > nameIdx) {
                      personalStatus = segments[nameIdx].trim();
                    }
                  }

                  let attendanceTag = "";
                  let memo = "";
                  if (personalStatus) {
                    const parts = personalStatus.split(',').map(s => s.trim());
                    let tagFound = [];
                    let memoFound = [];
                    parts.forEach(p => {
                      const clean = p.replace(/\s+/g, '');
                      if (ATTENDANCE_TAGS.includes(clean) || clean === "출석") {
                        tagFound.push(clean === "1" ? "출석" : clean);
                      } else if (/^\d+$/.test(clean)) {
                        tagFound.push("출석(" + clean + "명)");
                      } else if (p) {
                        memoFound.push(p);
                      }
                    });
                    attendanceTag = tagFound.join(', ') || (personalStatus ? "기록있음" : "");
                    memo = memoFound.join(', ');
                  }

                  const colDate = new Date(row.log_date);
                  colDate.setHours(0, 0, 0, 0);
                  const colMonth = colDate.getMonth() + 1;
                  const colDay = colDate.getDate();
                  const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                  const dateStr = `${colMonth}/${colDay}(${dayNames[colDate.getDay()]})`;

                  allParsed.push({
                    name,
                    dateStr,
                    colDate,
                    team: row.team || "기타",
                    teacher: row.teacher || "",
                    time: row.shift || "",
                    location: row.signature_url || row.location || "복지관",
                    attendanceTag,
                    memo,
                    group: (TEACHER_GROUPS[row.team] && TEACHER_GROUPS[row.team][row.teacher]) || "기타"
                  });
                });
              });
            }

            // 각 팀별 선생님 정렬
            Object.keys(teachersByTeam).forEach(t => {
              teachersByTeam[t].sort((a, b) => getTeacherSortWeight(t, a) - getTeacherSortWeight(t, b));
            });

            setTeacherListByTeam(teachersByTeam);

            allParsed.sort((a, b) => b.colDate - a.colDate);

            setAllRecords(allParsed);
          } catch (e) {
            console.error("Supabase 로드 실패:", e);
          } finally {
            setIsLoading(false);
            setLoadProgress("");
          }
        };

        loadAll();
      }, []);

      const filteredRecords = useMemo(() => {
        if (!selectedName || selectedName.trim() === "") return [];
        let raw = allRecords.filter(r => r.name === selectedName);
        if (teacherFilter !== "전체") {
          raw = raw.filter(r => r.teacher === teacherFilter);
        }
        if (raw.length === 0) return [];

        const dateMap = new Map();
        raw.forEach(r => {
          const key = r.colDate.getTime();
          if (dateMap.has(key)) {
            const existing = dateMap.get(key);
            const existingTeachers = existing.teacher.split(', ');
            if (!existingTeachers.includes(r.teacher)) {
              existing.teacher += ', ' + r.teacher;
            }
            if (r.location && r.location !== "복지관" && !existing.location.includes(r.location)) {
              existing.location += ', ' + r.location;
            }
            if (r.memo && !existing.memo.includes(r.memo)) {
              existing.memo = existing.memo ? existing.memo + ', ' + r.memo : r.memo;
            }
          } else {
            dateMap.set(key, { ...r });
          }
        });
        return Array.from(dateMap.values()).sort((a, b) => b.colDate - a.colDate);
      }, [selectedName, allRecords, teacherFilter]);

      const stats = useMemo(() => {
        if (filteredRecords.length === 0) return null;
        const attended = filteredRecords.filter(r => r.attendanceTag.includes("출석")).length;
        const absent = filteredRecords.filter(r => r.attendanceTag.includes("결석")).length;
        const canceled = filteredRecords.filter(r => r.attendanceTag.includes("취소")).length;
        return { total: filteredRecords.length, attended, absent, canceled };
      }, [filteredRecords]);

      return (
        <div className="min-h-[100dvh] flex flex-col bg-transparent font-sans text-gray-800">
          <div className="shrink-0 bg-gradient-to-r from-teal-600 to-teal-500 text-white shadow-lg z-40 relative">
            <div className="max-w-5xl mx-auto px-4 pb-4 pt-safe-4 flex justify-between items-start">
              <div>
                <div className="flex items-center mb-1">
                  <img src="Logo_of_Seoul.jpg" alt="서울시 로고" className="h-7 bg-white px-2 py-1 rounded-md object-contain mr-2" onError={(e) => e.target.style.display = 'none'} />
                  <h1 className="font-black text-xl leading-tight">성동노인종합복지관</h1>
                </div>
                <p className="text-lg font-bold text-yellow-300 mb-1">디지털교육 서포터즈</p>
              </div>
              <button onClick={onNavigateBack} className="text-xs flex flex-col items-center font-bold p-2 rounded-lg shadow-md transition-all touch-manipulation bg-teal-800 text-white opacity-90 active:scale-95">
                <Home className="w-5 h-5 mb-1" /> 처음으로
              </button>
            </div>
          </div>

          <div className="flex-1 flex flex-col pb-4">
            <div className="max-w-5xl w-full mx-auto flex-1 flex flex-col p-3 md:p-6 mt-2">
              <div className="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">
                <div className="bg-gradient-to-r from-teal-500 to-emerald-500 px-3 md:px-6 py-2.5">
                  <div className="flex items-start justify-between gap-1 md:gap-2">
                    <div className="flex flex-col min-w-0">
                      <h2 className="text-white font-extrabold text-[17px] md:text-xl flex items-center gap-1.5 md:gap-2 whitespace-nowrap mb-0.5">
                        <svg className="w-5 h-5 md:w-6 md:h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21" x2="16.65" y1="21" y2="16.65" /></svg>
                        <span className="truncate">대상자 검색</span>
                      </h2>
                      <p className="text-teal-100 text-[12px] md:text-base whitespace-nowrap">대상자를 선택하세요 ({filteredNames.length}명)</p>
                    </div>
                    <div className="flex flex-col items-end gap-1.5 shrink-0 ml-auto">
                      <div className="flex border border-gray-300 rounded-lg overflow-hidden shadow-sm">
                        {['전체', '1팀', '2팀', '3팀', '취업팀', '기타참여자'].map(t => (
                          <button key={t} onClick={() => { setTeamFilter(t); setTeacherFilter("전체"); }} className={`px-1 min-[360px]:px-1.5 md:px-4 py-1 md:py-1.5 border-r border-gray-300 text-[12px] min-[360px]:text-[13px] min-[400px]:text-[14px] landscape:text-[18px] md:text-lg font-semibold tracking-tighter transition last:border-r-0 ${teamFilter === t ? 'bg-[#2b5ce6] text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}`}>
                            {t}
                          </button>
                        ))}
                      </div>
                      <select
                        value={teacherFilter}
                        onChange={(e) => setTeacherFilter(e.target.value)}
                        className="bg-white border border-gray-300 rounded-lg px-2 py-0.5 md:py-1 text-[12px] min-[360px]:text-[13px] min-[400px]:text-[14px] landscape:text-[18px] md:text-lg font-bold text-gray-700 shadow-sm outline-none focus:ring-2 focus:ring-teal-400 w-fit min-w-[100px] min-[360px]:min-w-[120px] md:min-w-[160px] max-w-[130px] min-[360px]:max-w-[160px] min-[400px]:max-w-[190px] md:max-w-[260px] transition-all"
                      >
                        <option value="전체">선생님 선택</option>
                        {(() => {
                          let list = [];
                          if (teamFilter === "전체") {
                            const uniqueTeachers = new Set();
                            ["1팀", "2팀", "3팀", "취업팀", "기타참여자"].forEach(t => {
                              if (teacherListByTeam[t]) teacherListByTeam[t].forEach(name => uniqueTeachers.add(name));
                            });
                            list = Array.from(uniqueTeachers);
                          } else {
                            list = teacherListByTeam[teamFilter] || [];
                          }
                          return list.map((name, i) => <option key={i} value={name}>{name}</option>);
                        })()}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="px-3 md:px-6 py-3">
                  {isLoading ? (
                    <div className="flex flex-col items-center justify-center py-12 gap-3">
                      <Clock className="w-8 h-8 text-teal-500 animate-spin" />
                      <p className="text-teal-700 font-bold text-base animate-pulse">{loadProgress}</p>
                    </div>
                  ) : (
                    <div>

                      {/* 🔍 실시간 검색창 추가 */}
                      <div className="relative mb-3">
                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-teal-500 pointer-events-none">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input
                          type="text"
                          placeholder="이름 또는 초성 검색 (예: ㄱㄷㅎ)"
                          value={searchTerm}
                          onChange={(e) => {
                            const val = e.target.value;
                            setSearchTerm(val);
                            if (val.trim() !== "") {
                              setSelectedName("");
                            }
                          }}
                          className="w-full pl-10 pr-10 py-2 rounded-xl border-2 border-teal-300 focus:border-teal-500 focus:ring-4 focus:ring-teal-50 outline-none transition-all text-[15px] font-bold shadow-sm placeholder:text-gray-400"
                        />
                        {searchTerm && (
                          <button
                            onClick={() => setSearchTerm("")}
                            className="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 transition-colors"
                          >
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                          </button>
                        )}
                      </div>

                      {/* 🔍 검색 결과 없음 메시지 */}
                      {searchTerm && filteredNames.length === 0 && (
                        <div className="flex flex-col items-center justify-center py-6 bg-red-50/50 rounded-xl border border-red-100 mb-3 animate-fadeIn">
                          <svg className="w-10 h-10 text-red-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                          <p className="text-red-500 font-bold text-[15px]">해당 이름의 대상자가 없습니다.</p>
                        </div>
                      )}

                      {/* 🕒 최근 검색 대상자 */}
                      {recentSearches.length > 0 && !searchTerm && (
                        <div className="mb-3">
                          <div className="flex justify-between items-center mb-1 px-1">
                            <p className="text-[14px] md:text-[15] text-blue-700 font-extrabold">최근 찾은 대상자</p>
                            <button
                              onClick={() => {
                                setRecentSearches([]);
                                localStorage.removeItem('sungdong_recent_searches');
                              }}
                              className="text-[14px] md:text-[15px] text-blue-700 hover:text-blue-800 font-extrabold"
                            >
                              지우기
                            </button>
                          </div>
                          <div className="flex flex-wrap gap-1.5 items-center justify-center">
                            {recentSearches.map(name => (
                              <button
                                key={name}
                                onClick={() => {
                                  setSelectedName(name);
                                  setSearchTerm("");
                                }}
                                className={`px-3 py-1 rounded-full text-[13px] font-bold border transition-all active:scale-95 ${selectedName === name ? 'bg-teal-600 text-white border-teal-700 shadow-md' : 'bg-emerald-50 text-emerald-800 border-emerald-200 shadow-sm hover:bg-emerald-100 hover:border-emerald-300'}`}
                              >
                                {name}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* 대상자 리스트 */}
                      <div className="max-h-[194px] md:max-h-[384px] overflow-y-auto border-2 border-teal-300 rounded-xl p-1 bg-gray-50/50 overflow-x-hidden">
                        <div className="grid grid-cols-3 min-[380px]:grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-1">
                          {filteredNames.map(name => {
                            const isSpecial = name === "금호벽산경로당" || name === "금호벽산제2경로당";
                            const nameLen = name.length;
                            const effectiveLen = isSpecial ? 4 : nameLen;
                            const fontSizeClass = effectiveLen >= 8 ? 'text-[12px]' : effectiveLen >= 5 ? 'text-[14px]' : 'text-[16px]';
                            return (
                              <button
                                key={name}
                                onClick={() => {
                                  const newName = name === selectedName ? "" : name;
                                  setSelectedName(newName);
                                  if (newName) {
                                    setRecentSearches(prev => {
                                      const filtered = prev.filter(n => n !== newName);
                                      const updated = [newName, ...filtered].slice(0, 10);
                                      localStorage.setItem('sungdong_recent_searches', JSON.stringify(updated));
                                      return updated;
                                    });
                                  }
                                }}
                                className={`px-0.5 py-0.5 rounded-lg ${fontSizeClass} font-bold transition-all active:scale-95 touch-manipulation border flex items-center justify-center text-center break-keep leading-tight min-h-[34px] ${selectedName === name ? 'bg-teal-600 text-white border-teal-700 shadow-md' : 'bg-gray-200 text-gray-800 border-gray-400 hover:bg-teal-50 hover:border-teal-400 shadow-sm'}`}
                              >
                                {name === "금호벽산경로당" ? <span>금호벽산<br />경로당</span> :
                                  name === "금호벽산제2경로당" ? <span>금호벽산<br />제2경로당</span> :
                                    name}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {selectedName && stats && (
                  <div className="px-4 md:px-6 pb-3">
                    <div className="grid grid-cols-4 gap-2 md:gap-3">
                      <div className="bg-teal-200 rounded-xl p-2.5 md:p-3 text-center border border-teal-300">
                        <div className="text-[13px] md:text-[15px] text-teal-800 font-bold">전체</div>
                        <div className="text-2xl md:text-3xl font-black text-teal-900">{stats.total}</div>
                      </div>
                      <div className="bg-blue-200 rounded-xl p-2.5 md:p-3 text-center border border-blue-300">
                        <div className="text-[13px] md:text-[15px] text-blue-800 font-bold">출석</div>
                        <div className="text-2xl md:text-3xl font-black text-blue-900">{stats.attended}</div>
                      </div>
                      <div className="bg-red-200 rounded-xl p-2.5 md:p-3 text-center border border-red-300">
                        <div className="text-[13px] md:text-[15px] text-red-800 font-bold">결석</div>
                        <div className="text-2xl md:text-3xl font-black text-red-900">{stats.absent}</div>
                      </div>
                      <div className="bg-gray-200 rounded-xl p-2.5 md:p-3 text-center border border-gray-300">
                        <div className="text-[13px] md:text-[15px] text-gray-800 font-bold">취소</div>
                        <div className="text-2xl md:text-3xl font-black text-gray-900">{stats.canceled}</div>
                      </div>
                    </div>
                  </div>
                )}

                {selectedName && (
                  <div className="px-4 md:px-6 pb-5">
                    {filteredRecords.length === 0 ? (
                      <div className="text-center py-8 text-gray-400 font-bold text-base">학습 참여 기록이 없습니다.</div>
                    ) : (
                      <div className="space-y-2.5 md:space-y-3">
                        {filteredRecords.map((rec, idx) => {
                          const isAttended = rec.attendanceTag.includes("출석");
                          const isAbsent = rec.attendanceTag.includes("결석");
                          const isCanceled = rec.attendanceTag.includes("취소");
                          const borderColor = isAbsent ? "border-l-red-400" : isCanceled ? "border-l-gray-400" : isAttended ? "border-l-blue-400" : "border-l-teal-300";
                          const bgColor = isAbsent ? "bg-red-50/50" : isCanceled ? "bg-gray-50/50" : "bg-white";

                          return (
                            <div key={idx} className={`${bgColor} rounded-xl border border-gray-200 border-l-4 ${borderColor} shadow-sm overflow-hidden transition-all hover:shadow-md`}>
                              <div className="px-3 md:px-4 py-2.5 md:py-3">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className="font-extrabold text-[16px] md:text-[18px] text-gray-900 whitespace-nowrap">{rec.dateStr}</span>
                                  <span className="text-[14px] md:text-[16px] text-teal-600 font-bold bg-teal-50 px-2 py-0.5 rounded-full border border-teal-200 whitespace-nowrap">{rec.team}</span>
                                  <span className="text-[15px] md:text-[17px] text-[#2563eb] font-extrabold bg-[#eff6ff] px-2.5 py-0.5 rounded-lg border border-[#bfdbfe] whitespace-nowrap">{rec.name}</span>
                                  <span className="text-[14px] md:text-[16px] text-gray-500 font-bold whitespace-nowrap">({rec.teacher} 선생님)</span>
                                  <span className="text-[14px] md:text-[16px] text-gray-500 font-medium whitespace-nowrap">📍 {rec.location}</span>
                                </div>
                                <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                                  {rec.attendanceTag && (
                                    <span className={`text-[14px] md:text-[16px] font-bold px-2.5 py-0.5 rounded-full ${isAbsent ? 'bg-red-100 text-red-700 border border-red-300' : isCanceled ? 'bg-gray-200 text-gray-600 border border-gray-300' : 'bg-blue-100 text-blue-700 border border-blue-300'}`}>
                                      {rec.attendanceTag}
                                    </span>
                                  )}
                                  {rec.memo && (
                                    <span className="text-[14px] md:text-[16px] text-gray-700 font-medium">💬 {rec.memo}</span>
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 📅 4. 나의 주간 일정 보기 컴포넌트
    // =====================================================================
    function MyWeeklyScheduleApp({ team, teacher, onNavigateBack }) {
      const [currentWeekStart, setCurrentWeekStart] = useState(() => {
        const d = new Date();
        const day = d.getDay();
        if (day === 0) d.setDate(d.getDate() + 1);
        else if (day === 6) d.setDate(d.getDate() + 2);
        const newDay = d.getDay();
        const diff = d.getDate() - newDay + (newDay === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
      });

      const [scheduleData, setScheduleData] = useState(null);
      const [specialDays, setSpecialDays] = useState({});
      const [isLoading, setIsLoading] = useState(false);
      const [notice, setNotice] = useState("");
      const [supabaseRecords, setSupabaseRecords] = useState([]);

      const weekDays = ['월', '화', '수', '목', '금'];
      const [timeSlots, setTimeSlots] = useState([]);

      const getCurrentWeekDays = useCallback(() => {
        const days = [];
        for (let i = 0; i < 5; i++) {
          const d = new Date(currentWeekStart);
          d.setDate(currentWeekStart.getDate() + i);
          days.push(d);
        }
        return days;
      }, [currentWeekStart]);

      const currentDays = getCurrentWeekDays();
      const startMonth = currentDays[0].getMonth() + 1;
      const startDay = currentDays[0].getDate();
      const endMonth = currentDays[4].getMonth() + 1;
      const endDay = currentDays[4].getDate();

      const changeWeek = (offsetWeeks) => {
        const newDate = new Date(currentWeekStart);
        newDate.setDate(newDate.getDate() + (offsetWeeks * 7));
        setCurrentWeekStart(newDate);
      };

      const handleCurrentWeekClick = () => {
        const d = new Date();
        const day = d.getDay();
        if (day === 0) d.setDate(d.getDate() + 1);
        else if (day === 6) d.setDate(d.getDate() + 2);
        const newDay = d.getDay();
        const diff = d.getDate() - newDay + (newDay === 0 ? -6 : 1);
        setCurrentWeekStart(new Date(d.setDate(diff)));
      };



      // 1.5 주간 Supabase 데이터 페칭 (요일 범위나 팀, 선생님 변경 시)
      useEffect(() => {
        if (!team || !teacher || !currentWeekStart) return;

        const fetchWeeklySupabase = async () => {
          try {
            const days = getCurrentWeekDays();
            const startStr = getLocalDateString(days[0]);
            const endStr = getLocalDateString(days[4]);

            let query = window.supabaseClient
              .from('daily_logs')
              .select('*')
              .eq('team', team)
              .gte('log_date', startStr)
              .lte('log_date', endStr);

            if (teacher !== "__ALL__") {
              query = query.eq('teacher', teacher);
            }

            const { data, error } = await query;
            if (error) throw error;
            setSupabaseRecords(data || []);
          } catch (e) {
            console.error("주간 Supabase 데이터 로드 실패:", e);
          }
        };

        fetchWeeklySupabase();
      }, [team, teacher, currentWeekStart]);

      // 2. Supabase에서 읽어온 주간 레코드를 바탕으로 시간대별, 요일별 데이터 구조화
      useEffect(() => {
        if (!teacher || !currentWeekStart) return;

        const defaultSlots = ["9:30~10:30", "10:30~11:30", "11:30~12:30", "13:00~14:00", "14:00~15:00", "15:00~16:00"];

        const extractedSlots = new Set();
        supabaseRecords.forEach(r => {
          if (r.shift) extractedSlots.add(r.shift);
        });

        const finalSlots = extractedSlots.size > 0
          ? Array.from(extractedSlots).sort((a, b) => {
            const getT = (s) => {
              const m = s.match(/(\d+):(\d+)/) || s.match(/(\d+)\s*시/);
              return m ? parseInt(m[1]) * 60 + (m[2] ? parseInt(m[2]) : 0) : 9999;
            };
            return getT(a) - getT(b);
          })
          : defaultSlots;

        setTimeSlots(finalSlots);

        const parsedData = {};
        finalSlots.forEach(slot => {
          parsedData[slot] = {};
          currentDays.forEach(day => {
            const dateStr = getLocalDateString(day);
            const supRec = supabaseRecords.find(r => r.log_date === dateStr && r.shift === slot && (teacher === "__ALL__" || r.teacher === teacher));

            if (supRec) {
              parsedData[slot][dateStr] = {
                student: supRec.student || "",
                location: supRec.signature_url || supRec.location || "",
                status: supRec.status || "",
                isSpecial: false
              };
            } else {
              parsedData[slot][dateStr] = { student: "", location: "", status: "", isSpecial: false };
            }
          });
        });

        setScheduleData(parsedData);
      }, [teacher, currentWeekStart, supabaseRecords]);

      const getStatusColorClass = (statusStr) => {
        if (!statusStr) return "text-gray-800";
        const parts = statusStr.split(',').map(s => s.trim().replace(/\s+/g, ''));
        if (parts.includes("결석") || parts.includes("취소")) return "text-red-600";
        if (parts.includes("휴가") || parts.includes("선생님휴가")) return "text-gray-500";
        return "text-blue-700";
      };

      const parseWeeklyStatus = (statusStr) => {
        if (!statusStr) return { tags: [], memo: "" };
        const parts = statusStr.split(',').map(s => s.trim()).filter(Boolean);
        let tags = [];
        let memos = [];

        const tagKeywords = ['출석', '결석', '취소', '선생님휴가', '휴가'];

        parts.forEach((part, i) => {
          const cleanPart = part.replace(/\s+/g, '');

          // 다인원 출석 패턴 처리 (/ 포함 시)
          if (cleanPart.includes('/')) {
            const subParts = cleanPart.split('/');
            if (subParts.length === 2) {
              const [p1, p2] = subParts;
              const isP1Tag = /^\d+$/.test(p1) || tagKeywords.includes(p1);
              const isP2Tag = /^\d+$/.test(p2) || tagKeywords.includes(p2);

              if (isP1Tag && isP2Tag) {
                let t1 = p1 === '1' ? '출석' : (/^\d+$/.test(p1) ? '출석' + p1 : p1);
                let t2 = p2 === '1' ? '출석' : (/^\d+$/.test(p2) ? '출석' + p2 : p2);

                tags.push(`${t1}/${t2}`);
                return;
              }
            }
          }

          const isNumber = /^\d+$/.test(cleanPart);
          const hasKeyword = tagKeywords.some(k => cleanPart === k);

          let isTag = false;
          if (hasKeyword) {
            isTag = true;
          } else if (isNumber) {
            isTag = (i === 0);
          }

          if (isTag) {
            let displayTag = part;
            if (part === '1') displayTag = '출석';
            else if (isNumber) displayTag = `출석${part}`;
            tags.push(displayTag);
          } else {
            memos.push(part);
          }
        });

        return { tags, memo: memos.join(', ') };
      };

      return (
        <div className="min-h-[100dvh] flex flex-col bg-gray-50 font-sans">
          <header className="bg-blue-600 text-white px-4 pb-4 pt-safe-4 shadow-lg z-40 flex justify-between items-center relative">
            <div className="flex items-center">
              <div className="flex flex-col">
                <div className="flex items-center mb-1">
                  <img src="Logo_of_Seoul.jpg" alt="서울시 로고" className="h-7 bg-white px-2 py-1 rounded-md object-contain mr-2" onError={(e) => e.target.style.display = 'none'} />
                  <h1 className="font-black text-xl leading-tight">성동노인종합복지관</h1>
                </div>
                <p className="text-lg font-bold text-yellow-300">디지털교육 서포터즈</p>
                <p className="text-base opacity-95 flex items-center mt-1 font-bold">
                  <User className="w-4 h-4 mr-1" /> [{team}] {teacher.replace(/\n/g, ' ')} 선생님
                </p>
              </div>
            </div>
            <button onClick={onNavigateBack} className="text-xs flex flex-col items-center font-bold p-2 rounded-lg shadow-md transition-all touch-manipulation bg-blue-800 text-white opacity-90 active:scale-95">
              <Home className="w-5 h-5 mb-1" /> 처음으로
            </button>
          </header>

          <main className="flex-1 flex flex-col w-full mx-auto p-3 sm:p-5 lg:p-8">
            <div className="bg-white rounded-2xl shadow-xl border border-gray-200 flex flex-col flex-1 overflow-hidden">
              <div className="shrink-0 bg-white px-4 sm:px-6 pt-5 pb-4 shadow-sm relative z-10 flex flex-col items-center border-b border-gray-100">
                <h2 className="text-[18px] sm:text-2xl font-black text-gray-900 mb-4 flex items-center gap-2">
                  <MainCalendarIcon className="w-6 h-6 sm:w-7 sm:h-7 text-blue-600" />
