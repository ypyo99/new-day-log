                  나의 주간 일정 보기
                </h2>
                <div className="flex items-center gap-2 w-full max-w-sm md:max-w-md lg:max-w-lg mx-auto">
                  <button onClick={() => changeWeek(-1)} className="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center border-2 border-gray-300 rounded-xl bg-white shadow-sm hover:bg-gray-50 active:bg-gray-100 text-gray-700 shrink-0 transition-all touch-manipulation">
                    <svg className="w-7 h-7 md:w-8 md:h-8" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z" /></svg>
                  </button>
                  <div className="flex-1 h-12 md:h-14 flex items-center justify-center border-2 border-blue-400 rounded-xl bg-[#f0f7ff] text-center shadow-sm">
                    <h2 className="font-extrabold text-[#1e3a8a] text-[18px] sm:text-[22px] md:text-[24px] tracking-tight">{startMonth}/{startDay} ~ {endMonth}/{endDay}</h2>
                  </div>
                  <button onClick={handleCurrentWeekClick} className="px-4 h-12 md:h-14 border-2 border-blue-600 rounded-xl font-bold bg-blue-600 text-white shadow-sm hover:bg-blue-700 active:bg-blue-800 shrink-0 text-[16px] md:text-[18px] transition-all touch-manipulation">이번 주</button>
                  <button onClick={() => changeWeek(1)} className="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center border-2 border-gray-300 rounded-xl bg-white shadow-sm hover:bg-gray-50 active:bg-gray-100 text-gray-700 shrink-0 transition-all touch-manipulation">
                    <svg className="w-7 h-7 md:w-8 md:h-8" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z" /></svg>
                  </button>
                </div>
                {notice && <div className="mt-2 text-red-600 font-bold text-center animate-fadeIn">{notice}</div>}
                {isLoading && <div className="mt-3 text-sm sm:text-base text-red-600 font-bold flex items-center animate-pulse"><Clock className="w-4 h-4 mr-1 animate-spin" />일정 데이터를 불러오는 중...</div>}
              </div>

              <div className="flex-1 overflow-x-auto overflow-y-auto bg-gray-50/50 p-0">
                <div className="min-w-[650px] w-full md:w-[92%] lg:w-[88%] max-w-[1600px] bg-white rounded-xl shadow-sm border-2 border-gray-300 overflow-hidden mx-auto my-2 sm:my-4">
                  <table className="w-full table-fixed text-center border-collapse">
                    <thead>
                      <tr className="bg-[#eef2ff] border-b-2 border-gray-300">
                        <th className="w-[12%] py-2 md:py-3 border-r-2 border-gray-300 font-black text-gray-800 text-[clamp(1rem,2.2vw,1.3rem)]">시간</th>
                        {currentDays.map((day, i) => {
                          const dateStr = getLocalDateString(day);
                          const isToday = dateStr === getLocalDateString(new Date());

                          return (
                            <th key={i} style={{ width: '17.6%' }} className={`py-2 md:py-3 font-black text-[clamp(1rem,2.2vw,1.3rem)] tracking-tight transition-all ${isToday ? 'border-l-4 border-r-4 border-t-4 border-blue-600 text-blue-700 bg-blue-50' : 'border-r-2 border-gray-300 text-blue-900 last:border-0'}`}>
                              {day.getMonth() + 1}/{day.getDate()} ({weekDays[i]})
                            </th>
                          );
                        })}
                      </tr>
                    </thead>
                    <tbody>
                      {timeSlots.map((time, idx) => (
                        <tr key={idx} className="border-b-2 border-gray-300 last:border-0">
                          <td className="py-3 md:py-5 px-1 border-r-2 border-gray-300 bg-[#f8fafc] font-black text-blue-800 text-[clamp(0.95rem,2.1vw,1.25rem)] whitespace-pre-line leading-tight">
                            {time.replace('~', '\n~\n')}
                          </td>
                          {currentDays.map((day, i) => {
                            const dateStr = getLocalDateString(day);
                            const isToday = dateStr === getLocalDateString(new Date());
                            const specialDayInfo = specialDays && specialDays[dateStr];
                            const hasRealSchedule = timeSlots.some(t => {
                              const d = scheduleData?.[t]?.[dateStr];
                              return d && d.student && d.student.trim() !== "" && d.student.trim() !== "간담회";
                            });
                            const isSpecialDayMerged = specialDayInfo && !hasRealSchedule;

                            // 1. 특별한 날(간담회/공휴일) 병합 처리
                            if (isSpecialDayMerged && idx > 0) return null;

                            const isLastSlot = idx === timeSlots.length - 1;
                            const todayBorderClass = isToday ? `border-l-4 border-r-4 ${(isSpecialDayMerged || isLastSlot) ? 'border-b-4' : ''} border-blue-600 z-10` : 'border-r-2 border-gray-300 last:border-0';

                            const cellData = isSpecialDayMerged ? {
                              student: specialDayInfo.student,
                              location: specialDayInfo.location,
                              status: specialDayInfo.memo,
                              isSpecial: true
                            } : scheduleData?.[time]?.[dateStr];

                            if (!cellData || (!cellData.student && !cellData.location && !cellData.status)) {
                              return (
                                <td key={i} className={`p-0 align-top hover:bg-gray-50 transition-colors overflow-hidden ${todayBorderClass}`}>
                                  <div className="flex items-center justify-center h-full min-h-[110px] text-gray-300 font-bold text-[clamp(1rem,2vw,1.2rem)]">일정 없음</div>
                                </td>
                              );
                            }

                            const parsedStatus = parseWeeklyStatus(cellData.status);
                            const isAssistant = cellData.student && cellData.student.includes("보조강사");
                            const isKyungrodang = (cellData.student || "").includes("경로당") || (cellData.student || "").includes("복지관") || (cellData.location || "").includes("경로당") || ((cellData.location || "").includes("복지관") && (cellData.location || "").trim() !== "복지관");
                            const cardBgClass = isAssistant ? "bg-[#FFFF00]" : isKyungrodang ? "bg-orange-100" : "bg-white";

                            let cellBgClass = cardBgClass;
                            if (specialDayInfo) {
                              cellBgClass = "bg-red-200";
                            }

                            return (
                              <td key={i} rowSpan={isSpecialDayMerged ? 3 : 1} className={`${cellBgClass} p-0 align-middle transition-all overflow-hidden h-full hover:brightness-95 ${todayBorderClass}`}>
                                <div className={`flex flex-col gap-1 ${isSpecialDayMerged ? 'p-4 justify-center' : 'p-3 justify-center'} items-center h-full min-h-[110px] overflow-hidden w-full max-w-full`}>
                                  {parsedStatus.tags.length > 0 && !cellData.student?.includes("간담회") && (
                                    <div className="flex flex-wrap gap-1.5 justify-center w-full mb-1">
                                      {parsedStatus.tags.map((tag, tIdx) => {
                                        let tagStyle = "bg-blue-100 text-blue-700 border-blue-300";
                                        if (tag.includes('결석')) tagStyle = "bg-red-100 text-red-700 border-red-300";
                                        else if (tag.includes('취소')) tagStyle = "bg-orange-100 text-orange-700 border-orange-300";
                                        else if (tag.includes('휴가')) tagStyle = "bg-gray-200 text-gray-700 border-gray-400";
                                        else if (tag.includes('출석') || /^\d+/.test(tag)) tagStyle = "bg-blue-500 text-white border-blue-600 shadow-inner";
                                        return (
                                          <span key={tIdx} className={`px-2.5 py-1 rounded-lg text-[clamp(0.75rem,1.5vw,1rem)] font-extrabold border shadow-sm leading-none whitespace-nowrap overflow-hidden text-ellipsis max-w-full ${tagStyle}`}>
                                            {tag}
                                          </span>
                                        );
                                      })}
                                    </div>
                                  )}
                                  {cellData.student && <div className={`font-bold text-gray-900 text-[clamp(1.1rem,2.6vw,1.7rem)] leading-tight break-all whitespace-pre-wrap text-center w-full`}>{cellData.student.replace(/\n/g, ' ').replace(/부처님오신날/g, '부처님\n오신날').replace(/보조강사\s*/g, '보조강사\n').replace(/\//g, '/\n').trim()}</div>}
                                  {cellData.location && cellData.location !== "복지관" && team !== '취업팀' && <div className={`text-gray-600 text-[clamp(0.9rem,2.1vw,1.35rem)] font-bold break-all whitespace-pre-wrap text-center max-w-full leading-tight mt-1`}>{cellData.location.replace(/대체공휴일/g, '대체\n공휴일')}</div>}
                                  {parsedStatus.memo && <div className={`font-bold text-[clamp(0.9rem,2.1vw,1.35rem)] leading-snug break-words whitespace-pre-wrap text-center mt-1 w-full ${getStatusColorClass(cellData.status)}`}>{parsedStatus.memo.replace(/대체공휴일/g, '대체\n공휴일')}</div>}
                                </div>
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // =====================================================================
    // 🔀 5. 총괄 부모 컴포넌트
    // =====================================================================

    // =====================================================================
    // 🖥️ 신규: 팀 별 전체 일정 보기 프로그램
    // =====================================================================

    function TeamScheduleApp({ team, onNavigateBack }) {
      const [currentTeam, setCurrentTeam] = useState(team);
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().substring(0, 7)); // YYYY-MM
      const [teacherFilter, setTeacherFilter] = useState("전체");
      const [uniqueTeachers, setUniqueTeachers] = useState([]);
      const [viewMode, setViewMode] = useState("sheet"); // "sheet" or "list"
      const [exporting, setExporting] = useState(false);
      const [showExportModal, setShowExportModal] = useState(false);

      const fetchTeamData = async (month) => {
        setLoading(true);
        try {
          const [year, monthStr] = month.split('-');
          const firstDay = `${month}-01`;
          const lastDay = new Date(parseInt(year), parseInt(monthStr), 0).getDate();
          const cleanLastDayStr = `${month}-${String(lastDay).padStart(2, '0')}`;

          const { data: records, error } = await window.supabaseClient
            .from('daily_logs')
            .select('*')
            .eq('team', currentTeam)
            .gte('log_date', firstDay)
            .lte('log_date', cleanLastDayStr)
            .order('log_date', { ascending: false })
            .order('shift', { ascending: true });

          if (error) throw error;

          if (records) {
            setData(records);
            const tSet = new Set();
            // 💡 [신규] 해당 팀의 TEACHER_GROUPS 기본 선생님 목록을 디폴트로 무조건 포함시킴!
            if (TEACHER_GROUPS && TEACHER_GROUPS[currentTeam]) {
              Object.keys(TEACHER_GROUPS[currentTeam]).forEach(t => tSet.add(t));
            }
            records.forEach(r => { if (r.teacher) tSet.add(r.teacher); });
            setUniqueTeachers(Array.from(tSet).sort((a, b) => {
              return getTeacherSortWeight(currentTeam, a) - getTeacherSortWeight(currentTeam, b);
            }));
          }
        } catch (e) {
          console.error("데이터 로딩 실패:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (currentTeam) fetchTeamData(selectedMonth);
      }, [currentTeam, selectedMonth]);

      const changeMonth = (offset) => {
        const [year, m] = selectedMonth.split('-');
        let d = new Date(parseInt(year), parseInt(m) - 1 + offset, 1);
        const newY = d.getFullYear();
        const newM = String(d.getMonth() + 1).padStart(2, '0');
        setSelectedMonth(`${newY}-${newM}`);
      };

      const handleExportExcel = async () => {
        if (exporting) return;
        setExporting(true);
        try {
          const today = new Date();
          const year = today.getFullYear();
          const month = today.getMonth() + 1;
          const yearStr = String(year);
          const monthStr = String(month).padStart(2, '0');

          // 올해(현재 연도)의 1월 1일부터 검색
          const startDateStr = `${yearStr}-01-01`;

          let nextYear = year;
          let nextMonth = month + 1;
          if (nextMonth > 12) {
            nextMonth = 1;
            nextYear += 1;
          }
          const nextMonthLastDay = new Date(nextYear, nextMonth, 0).getDate();
          const endDateStr = `${nextYear}-${String(nextMonth).padStart(2, '0')}-${String(nextMonthLastDay).padStart(2, '0')}`;

          // 올해 최초 근무일자 조회
          let firstWorkDateStr = `${yearStr}-01-01`; // 기본값
          const { data: firstRec, error: firstRecErr } = await window.supabaseClient
            .from('daily_logs')
            .select('log_date')
            .gte('log_date', `${yearStr}-01-01`)
            .lte('log_date', endDateStr)
            .order('log_date', { ascending: true })
            .limit(1);

          if (!firstRecErr && firstRec && firstRec.length > 0) {
            firstWorkDateStr = firstRec[0].log_date;
          }

          const dateList = [];
          const [startYear, startMonth, startDay] = firstWorkDateStr.split('-').map(Number);
          let curr = new Date(startYear, startMonth - 1, startDay); // DB에 기록된 올해 첫 근무일부터 시작
          const endLimit = new Date(nextYear, nextMonth - 1, nextMonthLastDay);
          while (curr <= endLimit) {
            const dayOfWeekIndex = curr.getDay();
            if (dayOfWeekIndex !== 0 && dayOfWeekIndex !== 6) { // 일요일(0), 토요일(6) 제외
              const yyyy = curr.getFullYear();
              const mm = String(curr.getMonth() + 1).padStart(2, '0');
              const dd = String(curr.getDate()).padStart(2, '0');
              const dateStr = `${yyyy}-${mm}-${dd}`;

              const dayOfWeek = ["일", "월", "화", "수", "목", "금", "토"][dayOfWeekIndex];
              const label = `${curr.getMonth() + 1}/${curr.getDate()} (${dayOfWeek})`;

              dateList.push({
                dateStr,
                label,
                dayIndex: dayOfWeekIndex
              });
            }
            curr.setDate(curr.getDate() + 1);
          }

          const wb = XLSX.utils.book_new();
          const targetTeams = ["1팀", "2팀", "3팀", "취업팀"];
          const exportExcludedTeachersByTeam = {
            "1팀": new Set(["천은선", "서승희"])
          };

          for (const tName of targetTeams) {
            const isExcludedTeacherForExport = (teacher) => {
              const excluded = exportExcludedTeachersByTeam[tName];
              if (!excluded) return false;
              return excluded.has((teacher || "").trim());
            };

            // 해당 팀의 전체 데이터를 페이지 단위(Chunk)로 여러 번 나누어 받아와서 유실 방지 (Supabase 서버 강제 1000개 리밋 회피)
            let teamData = [];
            let start = 0;
            const limit = 1000;
            let hasMore = true;

            while (hasMore) {
              const { data: chunk, error: chunkErr } = await window.supabaseClient
                .from('daily_logs')
                .select('*')
                .eq('team', tName)
                .gte('log_date', firstWorkDateStr)
                .lte('log_date', endDateStr)
                .range(start, start + limit - 1)
                .order('log_date', { ascending: true });

              if (chunkErr) throw chunkErr;

              if (chunk && chunk.length > 0) {
                teamData = teamData.concat(chunk);
                if (chunk.length < limit) {
                  hasMore = false;
                } else {
                  start += limit;
                }
              } else {
                hasMore = false;
              }
            }

            const teamTeacherShiftsMap = {};
            if (TEACHER_GROUPS[tName]) {
              Object.entries(TEACHER_GROUPS[tName]).forEach(([teacher, group]) => {
                if (isExcludedTeacherForExport(teacher)) return;
                const tLogs = teamData.filter(r => r.teacher === teacher);
                if (tLogs.length > 0) {
                  tLogs.forEach(r => {
                    const key = `${teacher}::${r.shift}`;
                    teamTeacherShiftsMap[key] = {
                      teacher,
                      shift: r.shift,
                      groupName: group
                    };
                  });
                } else {
                  const defaultShift = (group === "오후" || tName === "3팀") ? "13:00~14:00" : "9:30~10:30";
                  const key = `${teacher}::${defaultShift}`;
                  teamTeacherShiftsMap[key] = {
                    teacher,
                    shift: defaultShift,
                    groupName: group
                  };
                }
              });
            }

            teamData.forEach(item => {
              if (isExcludedTeacherForExport(item.teacher)) return;
              if (tName === "취업팀" && TEACHER_GROUPS["취업팀"] && !TEACHER_GROUPS["취업팀"][item.teacher]) {
                return;
              }
              const key = `${item.teacher}::${item.shift}`;
              if (!teamTeacherShiftsMap[key]) {
                teamTeacherShiftsMap[key] = {
                  teacher: item.teacher,
                  shift: item.shift,
                  groupName: (TEACHER_GROUPS[tName] && TEACHER_GROUPS[tName][item.teacher]) || "기타"
                };
              }
            });

            const sortedShifts = Object.values(teamTeacherShiftsMap).sort((a, b) => {
              const weightA = getGroupWeight(a.groupName);
              const weightB = getGroupWeight(b.groupName);
              if (weightA !== weightB) return weightA - weightB;

              if (a.teacher !== b.teacher) {
                return getTeacherSortWeight(tName, a.teacher) - getTeacherSortWeight(tName, b.teacher);
              }
              return getShiftWeight(a.shift) - getShiftWeight(b.shift);
            });

            const gridRows = [];
            sortedShifts.forEach(ts => {
              gridRows.push({ ...ts, category: "대상" });
              gridRows.push({ ...ts, category: "장소" });
              gridRows.push({ ...ts, category: "진행" });
            });

            let startRowIdx = 0;
            while (startRowIdx < gridRows.length) {
              let count = 1;
              for (let nextRow = startRowIdx + 1; nextRow < gridRows.length; nextRow++) {
                if (gridRows[startRowIdx].groupName === gridRows[nextRow].groupName) {
                  count++;
                  gridRows[nextRow].renderGroup = false;
                } else {
                  break;
                }
              }
              gridRows[startRowIdx].rowspanGroup = count;
              gridRows[startRowIdx].renderGroup = true;
              startRowIdx += count;
            }

            startRowIdx = 0;
            while (startRowIdx < gridRows.length) {
              let count = 1;
              for (let nextRow = startRowIdx + 1; nextRow < gridRows.length; nextRow++) {
                if (gridRows[startRowIdx].groupName === gridRows[nextRow].groupName &&
                  gridRows[startRowIdx].teacher === gridRows[nextRow].teacher) {
                  count++;
                  gridRows[nextRow].renderTeacher = false;
                } else {
                  break;
                }
              }
              gridRows[startRowIdx].rowspanTeacher = count;
              gridRows[startRowIdx].renderTeacher = true;
              startRowIdx += count;
            }

            startRowIdx = 0;
            while (startRowIdx < gridRows.length) {
              let count = 1;
              for (let nextRow = startRowIdx + 1; nextRow < gridRows.length; nextRow++) {
                if (gridRows[startRowIdx].groupName === gridRows[nextRow].groupName &&
                  gridRows[startRowIdx].teacher === gridRows[nextRow].teacher &&
                  gridRows[startRowIdx].shift === gridRows[nextRow].shift) {
                  count++;
                  gridRows[nextRow].renderShift = false;
                } else {
                  break;
                }
              }
              gridRows[startRowIdx].rowspanShift = count;
              gridRows[startRowIdx].renderShift = true;
              startRowIdx += count;
            }

            const dataLookup = {};
            teamData.forEach(item => {
              const key = `${item.teacher}::${item.shift}::${item.log_date}`;
              dataLookup[key] = item;
            });

            const wsData = [];
            const headerRow = ["연번", "성명", "시간", ...dateList.map(d => d.label)];
            wsData.push(headerRow);

            const fontName = "Malgun Gothic";
            const borderThin = {
              top: { style: "thin", color: { rgb: "D1D5DB" } },
              bottom: { style: "thin", color: { rgb: "D1D5DB" } },
              left: { style: "thin", color: { rgb: "D1D5DB" } },
              right: { style: "thin", color: { rgb: "D1D5DB" } }
            };

            const firstRowHeaderStyle = {
              font: { name: fontName, sz: 10, bold: true, color: { rgb: "FFFFFF" } },
              fill: { fgColor: { rgb: "1E3A8A" } },
              alignment: { vertical: "center", horizontal: "center", wrapText: true },
              border: borderThin
            };

            const cellStyleGroup = {
              font: { name: fontName, sz: 9, bold: true, color: { rgb: "64748B" } },
              fill: { fgColor: { rgb: "F8FAFC" } },
              alignment: { vertical: "center", horizontal: "center" },
              border: borderThin
            };

            const cellStyleTeacher = {
              font: { name: fontName, sz: 10, bold: true, color: { rgb: "0F172A" } },
              fill: { fgColor: { rgb: "FFFFFF" } },
              alignment: { vertical: "center", horizontal: "center" },
              border: borderThin
            };

            const cellStyleShift = {
              font: { name: fontName, sz: 9, color: { rgb: "334155" } },
              fill: { fgColor: { rgb: "FFFFFF" } },
              alignment: { vertical: "center", horizontal: "center" },
              border: borderThin
            };

            const merges = [];

            gridRows.forEach((row, rIdx) => {
              const excelRowIdx = rIdx + 1;
              const rowArr = [];

              rowArr.push(row.groupName);
              rowArr.push(row.teacher);
              rowArr.push(row.shift);

              dateList.forEach(d => {
                const item = dataLookup[`${row.teacher}::${row.shift}::${d.dateStr}`];
                let val = "";
                if (item) {
                  if (row.category === "대상") {
                    val = item.student || "";
                  } else if (row.category === "장소") {
                    val = item.location || "";
                  } else if (row.category === "진행") {
                    val = item.status === "1" ? "1" : (item.status || "");
                  }
                }
                rowArr.push(val);
              });

              wsData.push(rowArr);

              if (row.renderGroup && row.rowspanGroup > 1) {
                merges.push({ s: { r: excelRowIdx, c: 0 }, e: { r: excelRowIdx + row.rowspanGroup - 1, c: 0 } });
              }
              if (row.renderTeacher && row.rowspanTeacher > 1) {
                merges.push({ s: { r: excelRowIdx, c: 1 }, e: { r: excelRowIdx + row.rowspanTeacher - 1, c: 1 } });
              }
              if (row.renderShift && row.rowspanShift > 1) {
                merges.push({ s: { r: excelRowIdx, c: 2 }, e: { r: excelRowIdx + row.rowspanShift - 1, c: 2 } });
              }
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData, { raw: true });

            // 💡 [날짜 오변환 완전 복원] xlsx-js-style이 raw:true를 무시하고 "1/1" 등을 Date로 자동 변환하는 문제 해결
            // 시트 생성 직후 모든 셀을 순회하며, Date 객체로 잘못 변환된 값을 원본 문자열(wsData)로 강제 복원
            const wsRange = XLSX.utils.decode_range(ws['!ref']);
            for (let R2 = wsRange.s.r; R2 <= wsRange.e.r; ++R2) {
              for (let C2 = wsRange.s.c; C2 <= wsRange.e.c; ++C2) {
                const ref = XLSX.utils.encode_cell({ r: R2, c: C2 });
                const c = ws[ref];
                if (c && (c.t === 'd' || c.t === 'n' || c.v instanceof Date)) {
                  // wsData의 원본 문자열 값으로 복원
                  const origRow = wsData[R2];
                  if (origRow && C2 < origRow.length) {
                    c.v = String(origRow[C2] ?? "");
                    c.t = 's';
                    delete c.w;
                    delete c.z;
                  }
                }
              }
            }

            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
              for (let C = range.s.c; C <= range.e.c; ++C) {
                const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                if (!ws[cellRef]) {
                  ws[cellRef] = { v: "" };
                }
                const cell = ws[cellRef];

                if (R === 0) {
                  cell.s = firstRowHeaderStyle;
                  continue;
                }

                const rowObj = gridRows[R - 1];
                if (C === 0) {
                  cell.s = cellStyleGroup;
                } else if (C === 1) {
                  cell.s = cellStyleTeacher;
                } else if (C === 2) {
                  cell.s = cellStyleShift;
                } else {
                  const dateObj = dateList[C - 3];
                  const item = dataLookup[`${rowObj.teacher}::${rowObj.shift}::${dateObj.dateStr}`];

                  let fillRGB = "FFFFFF";
                  let fontColorRGB = "475569";
                  let isBold = false;

                  if (item) {
                    const isHoliday = (item.student && /공휴일|근로자의날|어린이날|휴일|공휴/.test(item.student)) ||
                      (item.status && /공휴일|근로자의날|어린이날|휴일|공휴/.test(item.status)) ||
                      (item.location && /공휴일|근로자의날|어린이날|휴일|공휴/.test(item.location));

                    if (rowObj.category === "장소") {
                      fillRGB = "FFFFFF";
                      if (isHoliday) {
                        fontColorRGB = "EF4444";
                        isBold = true;
                      } else if (item.signature_url) {
                        fontColorRGB = "2563EB";
                        isBold = true;
                      } else if (item.location) {
                        fontColorRGB = "000000";
                      }
                    } else if (isHoliday) {
                      fillRGB = "FEE2E2";
                      fontColorRGB = "EF4444";
                      isBold = true;
                    } else {
                      if (rowObj.category === "대상") {
                        if (item.student?.includes('보조강사')) {
                          fillRGB = "FFFF00";
                          fontColorRGB = "000000";
                          isBold = true;
                        } else if (item.student) {
                          fillRGB = "E0F2FE";
                          fontColorRGB = "000000";
                          isBold = true;
                        }
                      } else if (rowObj.category === "진행") {
                        if (item.status?.includes('결석') || item.status?.includes('취소')) {
                          fillRGB = "FEE2E2";
                          fontColorRGB = "DC2626";
                          isBold = true;
                        } else if (item.status?.includes('휴가')) {
                          fillRGB = "F3F4F6";
                          fontColorRGB = "6B7280";
                          isBold = true;
                        } else if (item.status) {
                          fillRGB = "F0FDF4";
                          fontColorRGB = "000000";
                          isBold = true;
                        }
                      }
                    }
                  }

                  cell.s = {
                    font: { name: fontName, sz: 10, bold: isBold, color: { rgb: fontColorRGB } },
                    fill: { fgColor: { rgb: fillRGB } },
                    alignment: { vertical: "center", horizontal: "center", wrapText: true },
                    border: borderThin
                  };
                }

                // 💡 [오작동 방지 및 테두리 개별 오버라이드] 
                // 1/1 등의 진행값을 엑셀이 날짜 객체로 자동 해석하여 서식이 깨지는 문제를 모든 열에 대해 원천 차단
                if (R > 0 && rowObj) {
                  let origVal = "";
                  if (C === 0) {
                    origVal = rowObj.groupName || "";
                  } else if (C === 1) {
                    origVal = rowObj.teacher || "";
                  } else if (C === 2) {
                    origVal = rowObj.shift || "";
                  } else {
                    const dateObj = dateList[C - 3];
                    const item = dataLookup[`${rowObj.teacher}::${rowObj.shift}::${dateObj.dateStr}`];
                    if (item) {
                      if (rowObj.category === "대상") {
                        origVal = item.student || "";
                      } else if (rowObj.category === "장소") {
                        origVal = item.location || "";
                      } else if (rowObj.category === "진행") {
                        origVal = item.status === "1" ? "1" : (item.status || "");
                      }
                    }
                  }
                  cell.v = origVal;
                  cell.t = 's'; // 모든 데이터 셀을 텍스트 형식으로 고정
                }

                const nextRowObj = R > 0 ? gridRows[R] : null;
                const isTeacherBoundary = R > 0 && rowObj && (!nextRowObj || rowObj.teacher !== nextRowObj.teacher);
                const isShiftBoundary = R > 0 && rowObj && nextRowObj && rowObj.shift !== nextRowObj.shift;
                let rightBorder = { style: "thin", color: { rgb: "D1D5DB" } };

                if (C === 2) {
                  rightBorder = { style: "thick", color: { rgb: "4B5563" } };
                } else if (C >= 3) {
                  const dateObj = dateList[C - 3];
                  const nextDateObj = dateList[C - 2];
                  const isFriday = dateObj && dateObj.dayIndex === 5;
                  const isMonthEnd = dateObj && (!nextDateObj || dateObj.dateStr.slice(0, 7) !== nextDateObj.dateStr.slice(0, 7));

                  if (isMonthEnd) {
                    rightBorder = { style: "thick", color: { rgb: "4B5563" } };
                  } else if (isFriday) {
                    rightBorder = { style: "medium", color: { rgb: "2563EB" } };
                  }
                }

                const currentBorder = {
                  top: { style: "thin", color: { rgb: "D1D5DB" } },
                  bottom: isShiftBoundary
                    ? { style: "medium", color: { rgb: "2563EB" } }
                    : (isTeacherBoundary ? { style: "medium", color: { rgb: "6B7280" } } : { style: "thin", color: { rgb: "D1D5DB" } }),
                  left: { style: "thin", color: { rgb: "D1D5DB" } },
                  right: rightBorder
                };

                cell.s = { ...cell.s, border: currentBorder };
              }
            }

            ws['!merges'] = merges;

            const wscols = [
              { wch: 8 },
              { wch: 11 },
              { wch: 15 },
              ...dateList.map(() => ({ wch: 14 }))
            ];
            ws['!cols'] = wscols;

            const wsrows = [
              { hpt: 35 },
              ...gridRows.map(() => ({ hpt: 26 }))
            ];
            ws['!rows'] = wsrows;

            XLSX.utils.book_append_sheet(wb, ws, tName);
          }

          const todayYYYY = today.getFullYear();
          const todayMM = String(today.getMonth() + 1).padStart(2, '0');
          const todayDD = String(today.getDate()).padStart(2, '0');
          const filename = `디지털_서포터즈_일정표-${todayYYYY}-${todayMM}-${todayDD}.xlsx`;

          // 안전한 Blob 기반 다운로드 트리거 (브라우저 파일명 유실 버그 방지)
          const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'binary' });
          const buf = new ArrayBuffer(wbout.length);
          const view = new Uint8Array(buf);
          for (let i = 0; i < wbout.length; i++) {
            view[i] = wbout.charCodeAt(i) & 0xFF;
          }
          const blob = new Blob([buf], { type: 'application/octet-stream' });

          if (window.navigator && window.navigator.msSaveOrOpenBlob) {
            window.navigator.msSaveOrOpenBlob(blob, filename);
          } else {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => {
              window.URL.revokeObjectURL(url);
            }, 100);
          }
          setShowExportModal(true);
        } catch (err) {
          console.error(err);
          alert("⚠️ 엑셀 내보내기 중 오류가 발생했습니다: " + err.message);
        } finally {
          setExporting(false);
        }
      };

      const filteredData = data.filter(d => teacherFilter === "전체" || d.teacher === teacherFilter);

      // 날짜별로 그룹화 (목록형에서 사용)
      const groupedByDate = {};
      filteredData.forEach(item => {
        if (!groupedByDate[item.log_date]) groupedByDate[item.log_date] = [];
        groupedByDate[item.log_date].push(item);
      });

      // ==========================================
      // 구글시트형 격자 데이터 생성 로직
      // ==========================================
      const uniqueDates = Array.from(new Set(filteredData.map(item => item.log_date))).sort();

      const teacherShiftsMap = {};

      // 💡 [신규] 해당 팀이 '취업팀'인 경우, 공식 교사 4명의 기본 행(디폴트 시간대 포함)을 무조건 먼저 생성해 둠!
      if (currentTeam === "취업팀" && TEACHER_GROUPS["취업팀"]) {
        Object.entries(TEACHER_GROUPS["취업팀"]).forEach(([t, g]) => {
          const defaultShift = (g === "오후") ? "13:00~14:00" : "9:30~10:30";
          const key = `${t}::${defaultShift}`;
          teacherShiftsMap[key] = {
            teacher: t,
            shift: defaultShift,
            groupName: g
          };
        });
      }

      filteredData.forEach(item => {
        // 💡 [필터링] 취업팀 화면에서는 취업팀 공식 멤버가 아닌 강사(예: test_teacher 등)는 배제함!
        if (currentTeam === "취업팀" && TEACHER_GROUPS["취업팀"] && !TEACHER_GROUPS["취업팀"][item.teacher]) {
          return;
        }

        const key = `${item.teacher}::${item.shift}`;
        teacherShiftsMap[key] = {
          teacher: item.teacher,
          shift: item.shift,
          groupName: (TEACHER_GROUPS[currentTeam] && TEACHER_GROUPS[currentTeam][item.teacher]) || "기타"
        };
      });

      const sortedTeacherShifts = Object.values(teacherShiftsMap).sort((a, b) => {
        const weightA = getGroupWeight(a.groupName);
        const weightB = getGroupWeight(b.groupName);
        if (weightA !== weightB) return weightA - weightB;

        if (a.teacher !== b.teacher) {
          return getTeacherSortWeight(currentTeam, a.teacher) - getTeacherSortWeight(currentTeam, b.teacher);
        }
        return getShiftWeight(a.shift) - getShiftWeight(b.shift);
      });

      const gridRows = [];
      sortedTeacherShifts.forEach(ts => {
        gridRows.push({ ...ts, category: "대상" });
        gridRows.push({ ...ts, category: "장소" });
        gridRows.push({ ...ts, category: "진행" });
      });

      let startRow = 0;
      while (startRow < gridRows.length) {
        let count = 1;
        for (let nextRow = startRow + 1; nextRow < gridRows.length; nextRow++) {
          if (gridRows[startRow].groupName === gridRows[nextRow].groupName) {
            count++;
            gridRows[nextRow].renderGroup = false;
          } else {
            break;
          }
        }
        gridRows[startRow].rowspanGroup = count;
        gridRows[startRow].renderGroup = true;
        startRow += count;
      }

      startRow = 0;
      while (startRow < gridRows.length) {
        let count = 1;
        for (let nextRow = startRow + 1; nextRow < gridRows.length; nextRow++) {
          if (gridRows[startRow].groupName === gridRows[nextRow].groupName &&
            gridRows[startRow].teacher === gridRows[nextRow].teacher) {
            count++;
            gridRows[nextRow].renderTeacher = false;
          } else {
            break;
          }
        }
        gridRows[startRow].rowspanTeacher = count;
        gridRows[startRow].renderTeacher = true;
        startRow += count;
      }

      startRow = 0;
      while (startRow < gridRows.length) {
        let count = 1;
        for (let nextRow = startRow + 1; nextRow < gridRows.length; nextRow++) {
          if (gridRows[startRow].groupName === gridRows[nextRow].groupName &&
            gridRows[startRow].teacher === gridRows[nextRow].teacher &&
            gridRows[startRow].shift === gridRows[nextRow].shift) {
            count++;
            gridRows[nextRow].renderShift = false;
          } else {
            break;
          }
        }
        gridRows[startRow].rowspanShift = count;
        gridRows[startRow].renderShift = true;
        startRow += count;
      }

      const dataLookup = {};
      filteredData.forEach(item => {
        const key = `${item.teacher}::${item.shift}::${item.log_date}`;
        dataLookup[key] = item;
      });

      return (
        <div className="w-full min-h-screen bg-gray-50 flex flex-col font-sans">
          <div className="bg-white flex-1 flex flex-col overflow-hidden relative">
            {/* Header */}
            <div className="shrink-0 bg-[#2b5ce6] text-white shadow-md z-40 relative flex items-start px-4 pt-3 pb-7 min-h-[84px]">
              <div>
                <div className="flex items-center mb-1">
                  <img src="Logo_of_Seoul.jpg" alt="서울시 로고" className="h-7 bg-white px-2 py-1 rounded-md object-contain mr-2" onError={(e) => e.target.style.display = 'none'} />
                  <h1 className="font-black text-xl sm:text-2xl leading-tight">성동노인종합복지관</h1>
                </div>
                <p className="text-sm sm:text-base font-bold text-yellow-300">
                  디지털교육 서포터즈
                </p>
              </div>

              {/* [엑셀 내보내기] 버튼 - 수평 중앙 & 수직 하단 absolute 배치 */}
              <div className="absolute left-1/2 bottom-1.5 transform -translate-x-1/2 z-50">
                <button
                  onClick={handleExportExcel}
                  disabled={exporting}
                  className="px-5 py-1.5 md:px-7 md:py-2 rounded-lg border border-blue-900 bg-blue-800 text-white font-bold hover:bg-blue-900 shadow-lg active:scale-95 text-sm md:text-base transition-all flex items-center gap-1.5 disabled:opacity-50"
                >
                  <DownloadIcon className="w-4 h-4 md:w-5 md:h-5" />
                  <span>{exporting ? "생성 중..." : "내보내기"}</span>
                </button>
              </div>

              <div className="ml-auto">
                <button onClick={onNavigateBack} className="text-xs flex flex-col items-center font-bold p-2 rounded-lg shadow-md transition-all touch-manipulation bg-blue-800 text-white opacity-90 active:scale-95">
                  <Home className="w-5 h-5 mb-1" />
                  <span>처음으로</span>
                </button>
              </div>
            </div>

            {/* 필터 및 월 선택 */}
            <div className="bg-white border-b border-gray-200 px-4 py-3 flex flex-col md:flex-row gap-3 justify-between items-center z-10 shadow-sm relative">
              <div className="flex items-center gap-2 bg-blue-50 rounded-lg p-1 border border-blue-100 w-full md:w-auto justify-center">
                <button onClick={() => changeMonth(-1)} className="p-1.5 text-blue-600 hover:bg-blue-200 rounded-md transition-colors"><ChevronLeft className="w-5 h-5" /></button>
                <div className="font-bold text-blue-900 px-2 min-w-[90px] text-center">{selectedMonth}</div>
                <button onClick={() => changeMonth(1)} className="p-1.5 text-blue-600 hover:bg-blue-200 rounded-md transition-colors"><ChevronRight className="w-5 h-5" /></button>
              </div>

              <div className="flex flex-row flex-nowrap items-center gap-2 sm:gap-3 w-full md:w-auto justify-between md:justify-end">
                {/* 보기 방식 토글 */}
                <div className="flex items-center">
                  <div className="flex bg-gray-100 rounded-lg p-0.5 border border-gray-200">
                    <button
                      onClick={() => setViewMode("sheet")}
                      className={`px-2.5 py-1.5 text-xs font-bold rounded-md transition-all ${viewMode === "sheet" ? "bg-blue-600 text-white shadow-sm" : "text-gray-600 hover:text-gray-900"}`}
                    >
                      구글시트형
                    </button>
                    <button
                      onClick={() => setViewMode("list")}
                      className={`px-2.5 py-1.5 text-xs font-bold rounded-md transition-all ${viewMode === "list" ? "bg-blue-600 text-white shadow-sm" : "text-gray-600 hover:text-gray-900"}`}
                    >
                      목록형
                    </button>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 sm:gap-2">
                  <select
                    className="w-24 sm:w-28 border border-gray-300 rounded-lg px-2 py-1.5 text-xs sm:text-sm font-bold text-blue-800 bg-white shadow-sm focus:ring-2 focus:ring-blue-400 outline-none"
                    value={currentTeam}
                    onChange={(e) => {
                      setCurrentTeam(e.target.value);
                      setTeacherFilter("전체");
                    }}
                  >
                    <option value="" disabled hidden>팀</option>
                    <option value="1팀">1팀</option>
                    <option value="2팀">2팀</option>
                    <option value="3팀">3팀</option>
                    <option value="취업팀">취업팀</option>
                  </select>
                  <select
                    className="w-28 sm:w-36 border border-gray-300 rounded-lg px-2 py-1.5 text-xs sm:text-sm font-bold text-blue-800 bg-white shadow-sm focus:ring-2 focus:ring-blue-400 outline-none"
                    value={teacherFilter}
                    onChange={(e) => setTeacherFilter(e.target.value)}
                  >
                    <option value="전체">선생님</option>
                    {uniqueTeachers.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
              </div>
            </div>

            {/* 콘텐츠 영역 */}
            <div className="flex-1 overflow-y-auto p-2 sm:p-3 lg:p-1 bg-slate-50">
              {loading ? (
                <div className="flex flex-col items-center justify-center h-40 text-blue-500">
                  <RotateCcw className="w-8 h-8 animate-spin mb-3" />
                  <p className="font-bold">데이터를 불러오는 중입니다...</p>
                </div>
              ) : Object.keys(groupedByDate).length === 0 ? (
                <div className="flex flex-col items-center justify-center h-40 bg-white rounded-xl border border-dashed border-gray-300">
                  <p className="text-gray-500 font-bold">해당 월에 등록된 일정이 없습니다.</p>
                </div>
              ) : viewMode === "sheet" ? (
                /* ========================================================
                   1. 구글시트형 격자 테이블 뷰
                   ======================================================== */
                <div className="bg-white rounded-xl shadow-md border border-gray-300 overflow-hidden">
                  <div className="overflow-x-auto overflow-y-auto max-h-[70vh]">
                    <table className="table-fixed text-center border-collapse text-[13px] sm:text-sm md:text-base lg:text-lg min-w-[900px] w-full">
                      <thead className="sticky top-0 z-30 bg-[#2b5ce6] text-white">
                        <tr>
                          <th className="border border-blue-700 py-2.5 w-[50px] sm:w-[60px] md:w-[70px] lg:w-[80px] font-bold text-white bg-[#1E3A8A] text-[13px] sm:text-sm md:text-base lg:text-lg">연번</th>
                          <th className="border border-blue-700 py-2.5 w-[70px] sm:w-[80px] md:w-[90px] lg:w-[100px] font-bold text-white bg-[#1E3A8A] text-[13px] sm:text-sm md:text-base lg:text-lg">성명</th>
                          <th className="border border-blue-700 border-r-2 border-r-gray-700 py-2.5 w-[90px] sm:w-[100px] md:w-[115px] lg:w-[130px] font-bold text-white bg-[#1E3A8A] text-[13px] sm:text-sm md:text-base lg:text-lg">시간</th>
                          {uniqueDates.map(dateStr => {
                            const m = dateStr.split('-')[1];
                            const d = dateStr.split('-')[2];
                            const dayName = getDayName(dateStr);
                            const dayIndex = new Date(dateStr).getDay();
                            const isFriday = dayIndex === 5;
                            const idx = uniqueDates.indexOf(dateStr);
                            const nextDate = uniqueDates[idx + 1];
                            const isMonthEnd = !nextDate || dateStr.slice(0, 7) !== nextDate.slice(0, 7);
                            const rightBorderStyle = isMonthEnd
                              ? "3px solid #4B5563"
                              : (isFriday ? "2px solid #2563EB" : "1px solid #D1D5DB");
                            return (
                              <th key={dateStr} className="border border-blue-700 py-2 w-[90px] sm:w-[105px] md:w-[120px] lg:w-[135px] font-bold text-white bg-[#1E3A8A] whitespace-nowrap text-[13px] sm:text-sm md:text-base lg:text-lg" style={{ borderRight: rightBorderStyle }}>
                                {parseInt(m)}/{parseInt(d)} ({dayName})
                              </th>
                            );
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {gridRows.map((row, idx) => {
                          const isNewGroup = idx > 0 && gridRows[idx].renderGroup;
                          const isNewTeacher = idx > 0 && gridRows[idx].renderTeacher;
                          const isNewShift = idx > 0 && gridRows[idx].renderShift;

                          const borderStyle = isNewGroup
                            ? { borderTop: '2.5px solid #334155' }
                            : (isNewTeacher ? { borderTop: '2px solid #64748b' } : (isNewShift ? { borderTop: '2px solid #2563EB' } : {}));

                          return (
                            <tr key={idx} className="hover:bg-blue-50/40 bg-gray-50" style={{ ...borderStyle, height: '36px' }}>
                              {row.renderGroup && (
                                <td className="border border-gray-300 font-extrabold text-gray-800 bg-gray-50/80 align-middle py-1.5 px-0.5 text-[13px] sm:text-sm md:text-base lg:text-lg" rowSpan={row.rowspanGroup}>
                                  {row.groupName}
                                </td>
                              )}
                              {row.renderTeacher && (
                                <td className="border border-gray-300 font-bold text-gray-800 bg-[#F3F4F6] align-middle py-1.5 px-0.5 text-[13px] sm:text-sm md:text-base lg:text-lg" rowSpan={row.rowspanTeacher}>
                                  {row.teacher}
                                </td>
                              )}
                              {row.renderShift && (
                                <td className="border border-gray-300 border-r-2 border-r-gray-700 text-gray-700 font-bold align-middle py-1.5 px-0.5 text-[12px] sm:text-[13px] md:text-sm lg:text-base bg-gray-50" rowSpan={row.rowspanShift}>
                                  {row.shift}
                                </td>
                              )}

                              {uniqueDates.map((dateStr, dateIdx) => {
                                const item = dataLookup[`${row.teacher}::${row.shift}::${dateStr}`];
                                let cellContent = '';
                                let cellClass = "text-gray-400 font-normal bg-white";
                                const dayIndex = new Date(dateStr).getDay();
                                const isFriday = dayIndex === 5;
                                const nextDate = uniqueDates[dateIdx + 1];
                                const isMonthEnd = !nextDate || dateStr.slice(0, 7) !== nextDate.slice(0, 7);
                                const rightBorderStyle = isMonthEnd
                                  ? "3px solid #4B5563"
                                  : (isFriday ? "2px solid #2563EB" : "1px solid #D1D5DB");

                                if (item) {
                                  const isHoliday = (item.student && /공휴일|근로자의날|어린이날|휴일|공휴/.test(item.student)) ||
                                    (item.status && /공휴일|근로자의날|어린이날|휴일|공휴/.test(item.status)) ||
                                    (item.location && /공휴일|근로자의날|어린이날|휴일|공휴/.test(item.location));

                                  if (isHoliday) {
                                    if (row.category === "대상") {
                                      cellContent = item.student || '공휴일';
                                      cellClass = "bg-red-700 text-white font-extrabold text-[12px] sm:text-[13px] md:text-sm lg:text-base py-1 px-1";
                                    } else if (row.category === "장소") {
                                      cellContent = item.location || '공휴일';
                                      cellClass = "!bg-white text-red-700 font-extrabold text-[13px] sm:text-[14px] py-1 px-1";
                                    } else if (row.category === "진행") {
                                      cellContent = item.status || '';
                                      if (item.status?.includes('결석') || item.status?.includes('취소')) {
                                        cellClass = "bg-red-700 text-white font-extrabold text-[13px] sm:text-[14px] py-1 px-1";
                                      } else if (item.status?.includes('휴가')) {
                                        cellClass = "bg-gray-200 text-gray-700 font-bold text-[13px] sm:text-[14px] py-1 px-1";
                                      } else if (item.status) {
                                        cellClass = "bg-[#F0FDF4] text-black font-extrabold text-[13px] sm:text-[14px] py-1 px-1";
                                      } else {
                                        cellClass = "bg-gray-50 text-gray-400 font-normal";
                                      }
                                    }
                                  } else {
                                    if (row.category === "대상") {
                                      cellContent = item.student || '';
                                      if (item.student?.includes('보조강사')) {
                                        cellClass = "bg-yellow-300 text-gray-950 font-extrabold text-[12px] sm:text-[13px] md:text-sm lg:text-base py-1 px-1";
                                      } else if (item.student) {
                                        cellClass = "text-gray-950 font-bold bg-sky-100";
                                      }
                                    } else if (row.category === "장소") {
                                      if (item.signature_url) {
                                        cellContent = (
                                          <a href={item.signature_url} target="_blank" rel="noopener noreferrer" className="text-blue-600 underline text-[12px] sm:text-[13px] md:text-sm lg:text-base font-extrabold hover:text-blue-800">서명 보기</a>
                                        );
                                        cellClass = "!bg-white";
                                      } else {
                                        cellContent = (
                                          <span className="text-black font-medium truncate max-w-[75px] sm:max-w-[95px] lg:max-w-[125px] block mx-auto text-[11px] sm:text-[13px] md:text-sm lg:text-base">
                                            {item.location || ''}
                                          </span>
                                        );
                                        cellClass = "!bg-white";
                                      }
                                    } else if (row.category === "진행") {
                                      cellContent = item.status || '';
                                      if (item.status?.includes('결석') || item.status?.includes('취소')) {
                                        cellClass = "text-red-600 font-extrabold bg-red-50";
                                      } else if (item.status?.includes('휴가')) {
                                        cellClass = "text-gray-500 font-bold bg-gray-100";
                                      } else if (item.status) {
                                        cellClass = "text-black font-bold bg-[#F0FDF4]";
                                      } else {
                                        cellClass = "text-gray-400 font-normal bg-white";
                                      }
                                    }
                                  }
                                }

                                return (
                                  <td key={dateStr} className={`border border-gray-300 py-1.5 px-0.5 align-middle text-center text-[13px] sm:text-sm md:text-base lg:text-[17px] ${cellClass}`} style={{ height: '36px', borderRight: rightBorderStyle, ...(row.category === "장소" ? { backgroundColor: "#ffffff" } : {}) }}>{cellContent || '\u00A0'}
                                  </td>
                                );
                              })}
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              ) : (
                /* ========================================================
                   2. 목록형 일정 뷰
                   ======================================================== */
                <div className="space-y-5">
                  {Object.entries(groupedByDate).sort(([a], [b]) => b.localeCompare(a)).map(([dateStr, items]) => {
                    const sortedItems = [...items].sort((a, b) => {
                      const groupA = (TEACHER_GROUPS[currentTeam] && TEACHER_GROUPS[currentTeam][a.teacher]) || "기타";
                      const groupB = (TEACHER_GROUPS[currentTeam] && TEACHER_GROUPS[currentTeam][b.teacher]) || "기타";

                      const weightA = getGroupWeight(groupA);
                      const weightB = getGroupWeight(groupB);
                      if (weightA !== weightB) return weightA - weightB;

                      if (a.teacher !== b.teacher) {
                        return a.teacher.localeCompare(b.teacher);
                      }

                      return getShiftWeight(a.shift) - getShiftWeight(b.shift);
                    });

                    const parsedItems = sortedItems.map(item => ({
                      ...item,
                      groupName: (TEACHER_GROUPS[currentTeam] && TEACHER_GROUPS[currentTeam][item.teacher]) || "기타",
                      rowspan: { group: 1, teacher: 1 },
                      render: { group: true, teacher: true }
                    }));

                    let startRow = 0;
                    while (startRow < parsedItems.length) {
                      let count = 1;
                      for (let nextRow = startRow + 1; nextRow < parsedItems.length; nextRow++) {
                        if (parsedItems[startRow].groupName === parsedItems[nextRow].groupName) {
                          count++;
                          parsedItems[nextRow].render.group = false;
                        } else {
                          break;
                        }
                      }
                      parsedItems[startRow].rowspan.group = count;
                      startRow += count;
                    }

                    startRow = 0;
                    while (startRow < parsedItems.length) {
                      let count = 1;
                      for (let nextRow = startRow + 1; nextRow < parsedItems.length; nextRow++) {
                        if (parsedItems[startRow].groupName === parsedItems[nextRow].groupName &&
                          parsedItems[startRow].teacher === parsedItems[nextRow].teacher) {
                          count++;
                          parsedItems[nextRow].render.teacher = false;
                        } else {
                          break;
                        }
                      }
                      parsedItems[startRow].rowspan.teacher = count;
                      startRow += count;
                    }

                    return (
                      <div key={dateStr} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="bg-blue-100/50 px-4 py-2.5 border-b border-gray-200 flex items-center gap-2">
                          <CalendarIcon className="w-5 h-5 text-blue-600" />
                          <span className="font-black text-blue-900 text-[17px]">{dateStr} ({getDayName(dateStr)})</span>
                        </div>
                        <div className="p-0 overflow-x-auto">
                          <table className="w-full text-center border-collapse text-xs sm:text-sm min-w-[600px]">
                            <thead>
                              <tr className="bg-gray-100 border-b border-gray-200 text-gray-700 font-bold">
                                <th className="border-r border-gray-200 py-2 w-[12%]">조</th>
                                <th className="border-r border-gray-200 py-2 w-[18%]">강사명</th>
                                <th className="border-r border-gray-200 py-2 w-[18%]">시간</th>
                                <th className="border-r border-gray-200 py-2 w-[22%]">대상(학생)</th>
                                <th className="border-r border-gray-200 py-2 w-[18%]">장소/서명</th>
                                <th className="py-2 w-[12%]">출결 상태</th>
                              </tr>
                            </thead>
                            <tbody>
                              {parsedItems.map((item, idx) => {
                                const isNewGroup = idx > 0 && parsedItems[idx].render.group;
                                const isNewTeacher = idx > 0 && parsedItems[idx].render.teacher;
                                const rowStyle = isNewGroup
                                  ? { borderTop: '2px solid #cbd5e1' }
                                  : (isNewTeacher ? { borderTop: '1px solid #e2e8f0' } : {});

                                return (
                                  <tr key={idx} className="hover:bg-blue-50/40 bg-white" style={rowStyle}>
                                    {item.render.group && (
                                      <td className="border-r border-b border-gray-200 font-extrabold text-gray-700 bg-gray-50/80 align-middle py-2 px-1" rowSpan={item.rowspan.group}>
                                        {item.groupName}
                                      </td>
                                    )}
                                    {item.render.teacher && (
                                      <td className="border-r border-b border-gray-200 font-bold text-blue-900 bg-blue-50/10 align-middle py-2 px-1" rowSpan={item.rowspan.teacher}>
                                        {item.teacher}
                                      </td>
                                    )}
                                    <td className="border-r border-b border-gray-200 text-blue-700 font-bold align-middle py-2 px-1">{item.shift}</td>
                                    <td className="border-r border-b border-gray-200 text-gray-800 font-medium align-middle py-2 px-1">
                                      {item.student ? (
                                        <span className={item.student?.includes('보조강사')
                                          ? 'bg-yellow-100 px-1.5 py-0.5 rounded text-yellow-800 text-[11px] font-bold'
                                          : 'bg-sky-100 px-1.5 py-0.5 rounded text-sky-800 text-[11px] font-bold'}>
                                          {item.student}
                                        </span>
                                      ) : '-'}
                                    </td>
                                    <td className="border-r border-b border-gray-200 text-black align-middle py-2 px-1">
                                      {item.signature_url ? (
                                        <a href={item.signature_url} target="_blank" rel="noopener noreferrer" className="text-blue-500 underline text-xs font-bold hover:text-blue-700">서명 보기</a>
                                      ) : (
                                        <span className="truncate block max-w-[120px] mx-auto" title={item.location}>{item.location || '-'}</span>
                                      )}
                                    </td>
                                    <td className="border-b border-gray-200 align-middle py-2 px-1">
                                      <span className={`font-bold text-[11px] px-1.5 py-0.5 rounded ${item.status?.includes('결석') || item.status?.includes('취소')
                                        ? 'bg-red-50 text-red-500 border border-red-200'
                                        : item.status?.includes('휴가')
                                          ? 'bg-gray-100 text-gray-500 border border-gray-300'
                                          : item.status && item.status !== '1'
                                            ? 'bg-green-50 text-black border border-green-200'
                                            : 'text-gray-400'
                                        }`}>
                                        {item.status || '-'}
                                      </span>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
            {/* 엑셀 완료 안내 모달 */}
            {showExportModal && (
              <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform transition-all border border-gray-100 flex flex-col items-center">
                  <div className="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mb-4 text-green-600 text-2xl">
                    🎉
                  </div>
                  <h3 className="text-lg font-bold text-gray-900 mb-2">엑셀 다운로드 완료</h3>
                  <p className="text-gray-500 text-sm text-center mb-6">
                    디지털 서포터즈 일정표 엑셀 파일 내보내기가 완료되었습니다.
                  </p>
                  <button
                    onClick={() => setShowExportModal(false)}
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-md transition-colors active:scale-95"
                  >
                    확인
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 📅 6. 시간표 자동 작성 컴포넌트 (신규)
    // =====================================================================
    function AutoScheduleApp({ onNavigateBack }) {
      const [isAdmin, setIsAdmin] = useState(false);
      const [showPwdModal, setShowPwdModal] = useState(false);
      const [pwdInput, setPwdInput] = useState("");
      const [pwdError, setPwdError] = useState(false);
      const pwdInputRef = useRef(null);

      useEffect(() => {
        try {
          if (showPwdModal && pwdInputRef.current) {
            pwdInputRef.current.focus();
          }
        } catch (e) {
          console.error("Focus useEffect Error:", e);
        }
      }, [showPwdModal]);

      const handleAdminClick = () => {
        try {
          if (isAdmin) {
            setIsAdmin(false);
          } else {
            setShowPwdModal(true);
            setPwdInput("");
            setPwdError(false);
          }
        } catch (e) {
          alert("handleAdminClick 오류: " + e.message);
        }
      };

      const checkPassword = () => {
        try {
          if (pwdInput === "qqq") {
            setIsAdmin(true);
            setShowPwdModal(false);
          } else {
            setPwdError(true);
          }
        } catch (e) {
          alert("checkPassword 오류: " + e.message);
        }
      };

      const [startDate, setStartDate] = useState(() => {
        const d = new Date();
        d.setMonth(d.getMonth() + 1);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        return `${yyyy}-${mm}-01`;
      });
      const [endDate, setEndDate] = useState(() => {
        const d = new Date();
        d.setMonth(d.getMonth() + 2);
        d.setDate(0);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      });
      const [team, setTeam] = useState("1팀");
      const [analyzing, setAnalyzing] = useState(false);
      const [baseWeekDates, setBaseWeekDates] = useState([]);
      const [draftRecords, setDraftRecords] = useState([]);
      const [scheduleTemplates, setScheduleTemplates] = useState({}); // 요일별 미리보기용 템플릿
      const [saving, setSaving] = useState(false);
      const [progressMsg, setProgressMsg] = useState("");
      const [notice, setNotice] = useState("");
      const [previewFilter, setPreviewFilter] = useState("ALL");
      const [showConfirmModal, setShowConfirmModal] = useState(false);
      const [showSuccessModal, setShowSuccessModal] = useState(false);
      const [editCell, setEditCell] = useState(null); // { teacherName, dayNum, shift, student, location }

      const getPrevMonthLastWeek = (startDateStr) => {
        const date = new Date(startDateStr);
        date.setMonth(date.getMonth() - 1);
        const year = date.getFullYear();
        const month = date.getMonth();

        const weekdays = [];
        let d = new Date(year, month + 1, 0);
        while (weekdays.length < 5) {
          const day = d.getDay();
          if (day !== 0 && day !== 6) {
            weekdays.push(new Date(d));
          }
          d.setDate(d.getDate() - 1);
        }
        weekdays.sort((a, b) => a - b);
        return weekdays.map(d => {
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
        });
      };

      const getWeekdaysInRange = (startStr, endStr) => {
        const list = [];
        let curr = new Date(startStr);
        const end = new Date(endStr);
        while (curr <= end) {
          const day = curr.getDay();
          if (day !== 0 && day !== 6) {
            const yyyy = curr.getFullYear();
            const mm = String(curr.getMonth() + 1).padStart(2, '0');
            const dd = String(curr.getDate()).padStart(2, '0');
            list.push(`${yyyy}-${mm}-${dd}`);
          }
          curr.setDate(curr.getDate() + 1);
        }
        return list;
      };

      const getShiftWeight = (shift) => {
        const m = shift.match(/(\d+):(\d+)/);
        return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : 0;
      };

      const getGroupWeight = (groupName) => {
        if (!groupName) return 99;
        if (groupName.includes("1조") || groupName.includes("A조")) return 1;
        if (groupName.includes("2조") || groupName.includes("B조")) return 2;
        if (groupName.includes("3조") || groupName.includes("C조")) return 3;
        return 99;
      };

      const handleAnalyze = async () => {
        if (!startDate || !endDate) {
          alert("시작일자와 종료일자를 선택해주세요.");
          return;
        }
        if (new Date(startDate) > new Date(endDate)) {
          alert("시작일자는 종료일자보다 빠르거나 같아야 합니다.");
          return;
        }

        setAnalyzing(true);
        setNotice("");
        setDraftRecords([]);
        setScheduleTemplates({});
        setPreviewFilter("ALL");
        setProgressMsg("선생님 명단 및 복제 기준 주간 계산 중...");

        try {
          const { data: teacherList, error: tErr } = await window.supabaseClient
            .from('teachers')
            .select('*')
            .eq('team', team);

          if (tErr) throw tErr;
          if (!teacherList || teacherList.length === 0) {
            setNotice(`⚠️ ${team}에 등록된 선생님이 없습니다.`);
            setAnalyzing(false);
            return;
          }

          const teacherNames = teacherList.map(t => t.name.trim());
          const baseDates = getPrevMonthLastWeek(startDate);
          setBaseWeekDates(baseDates);

          setProgressMsg("기준 주간의 수업 기록 분석 중...");
          let baseLogs = [];
          const { data, error } = await window.supabaseClient
            .from('daily_logs')
            .select('*')
            .eq('team', team)
            .in('log_date', baseDates);
          if (error) throw error;
          baseLogs = data || [];

          const templates = {};
          teacherNames.forEach(name => {
            templates[name] = { 1: {}, 2: {}, 3: {}, 4: {}, 5: {} };
          });

          const previewTemplates = {};

          setProgressMsg("공휴일 및 휴강 일정 역추적 분석 중...");
          const EXCLUDE_KEYWORDS = ["공휴일", "대체공휴일", "근로자의날", "어린이날", "현충일", "광복절", "개천절", "한글날", "석가탄신일", "부처님오신날", "성탄절", "제헌절", "추석", "설날", "신정", "선거일", "간담회", "소양교육", "자체학습", "휴가", "휴강", "준비", "자체학습"];

          for (const teacherName of teacherNames) {
            const teacherObj = teacherList.find(t => t.name.trim() === teacherName);
            const tGroup = teacherObj.group_name || TEACHER_GROUPS[team]?.[teacherName] || "기타";
            const shifts = [teacherObj.shift1, teacherObj.shift2, teacherObj.shift3].map(s => (s || "").trim()).filter(Boolean);

            previewTemplates[teacherName] = {
              group: tGroup,
              shifts: shifts,
              days: { 1: {}, 2: {}, 3: {}, 4: {}, 5: {} }
            };

            for (let dayOfWeek = 1; dayOfWeek <= 5; dayOfWeek++) {
              // 인덱스가 아닌, 실제 요일(getDay())이 일치하는 날짜를 찾습니다
              const baseDate = baseDates.find(dateStr => {
                const d = new Date(dateStr);
                return d.getDay() === dayOfWeek;
              });

              if (!baseDate) continue; // 해당 요일이 기준 주에 없으면 스킵

              let dayRecords = baseLogs.filter(l => l.teacher.trim() === teacherName && l.log_date === baseDate);

              let hasReal = dayRecords.some(r => {
                const s = (r.student || "").trim();
                return s && !EXCLUDE_KEYWORDS.some(kw => s.includes(kw));
              });

              let targetRecords = dayRecords;

              if (!hasReal) {
                let fallbackDate = baseDate;
                for (let attempt = 1; attempt <= 5; attempt++) {
                  const d = new Date(fallbackDate);
                  d.setDate(d.getDate() - 7);

                  const yyyy = d.getFullYear();
                  const mm = String(d.getMonth() + 1).padStart(2, '0');
                  const dd = String(d.getDate()).padStart(2, '0');
                  fallbackDate = `${yyyy}-${mm}-${dd}`;

                  const { data: fbRecords, error: fbErr } = await window.supabaseClient
                    .from('daily_logs')
                    .select('*')
                    .eq('team', team)
                    .eq('teacher', teacherName)
                    .eq('log_date', fallbackDate);

                  if (!fbErr && fbRecords && fbRecords.length > 0) {
                    const fbHasReal = fbRecords.some(r => {
                      const s = (r.student || "").trim();
                      return s && !EXCLUDE_KEYWORDS.some(kw => s.includes(kw));
                    });
                    if (fbHasReal) {
                      targetRecords = fbRecords;
                      break;
                    }
                  }
                }
              }

              shifts.forEach(shift => {
                const match = targetRecords.find(r => r.shift.trim() === shift);
                const student = match ? (match.student || "") : "";
                const location = match ? (match.signature_url || match.location || "") : "";

                templates[teacherName][dayOfWeek][shift] = {
                  student: student,
                  location: location
                };

                previewTemplates[teacherName].days[dayOfWeek][shift] = {
                  student: student,
                  location: location
                };
              });
            }
          }

          setProgressMsg("대상 기간 시간표 드래프트 작성 중...");
          const targetDates = getWeekdaysInRange(startDate, endDate);
          const drafts = [];

          targetDates.forEach(dateStr => {
            const d = new Date(dateStr);
            const dayOfWeek = d.getDay();

            teacherList.forEach(t => {
              const teacherName = t.name.trim();
              const shifts = [t.shift1, t.shift2, t.shift3].map(s => (s || "").trim()).filter(Boolean);

              shifts.forEach(shift => {
                const temp = templates[teacherName][dayOfWeek]?.[shift];
                const student = temp ? temp.student : "";
                const location = temp ? temp.location : "";

                const isUrl = location.startsWith("http");
                const finalLocation = isUrl ? "" : (location.trim() || "복지관");

                drafts.push({
                  team: team,
                  log_date: dateStr,
                  teacher: teacherName,
                  shift: shift,
                  student: student,
                  location: finalLocation,
                  status: "",
                  signature_url: null
                });
              });
            });
          });

          drafts.sort((a, b) => {
            if (a.log_date !== b.log_date) return a.log_date.localeCompare(b.log_date);

            const groupA = TEACHER_GROUPS[team]?.[a.teacher] || "기타";
            const groupB = TEACHER_GROUPS[team]?.[b.teacher] || "기타";
            const weightA = getGroupWeight(groupA);
            const weightB = getGroupWeight(groupB);
            if (weightA !== weightB) return weightA - weightB;

            if (a.teacher !== b.teacher) {
              return getTeacherSortWeight(team, a.teacher) - getTeacherSortWeight(team, b.teacher);
            }

            return getShiftWeight(a.shift) - getShiftWeight(b.shift);
          });

          setDraftRecords(drafts);
          setScheduleTemplates(previewTemplates);
          if (drafts.length === 0) {
            setNotice("⚠️ 작성할 수 있는 일정이 존재하지 않습니다.");
          }
        } catch (err) {
          console.error(err);
          setNotice("⚠️ 분석 중 오류가 발생했습니다: " + err.message);
        } finally {
          setAnalyzing(false);
        }
      };

      const handleCellEdit = (teacherName, dayNum, shift, newStudent, newLocation) => {
        // scheduleTemplates 업데이트
        setScheduleTemplates(prev => {
          const updated = JSON.parse(JSON.stringify(prev));
          if (!updated[teacherName].days[dayNum]) updated[teacherName].days[dayNum] = {};
          updated[teacherName].days[dayNum][shift] = { student: newStudent, location: newLocation };
          return updated;
        });
        // draftRecords 업데이트 (같은 teacher + shift + 요일(getDay)인 모든 레코드)
        setDraftRecords(prev => prev.map(r => {
          if (r.teacher !== teacherName || r.shift !== shift) return r;
          const d = new Date(r.log_date);
          if (d.getDay() !== dayNum) return r;
          return { ...r, student: newStudent, location: newLocation };
        }));
        setEditCell(null);
      };

      const handleSave = async () => {
        if (draftRecords.length === 0) return;
        setShowConfirmModal(false);
        setSaving(true);
        setProgressMsg("시간표 저장을 준비 중입니다...");

        try {
          const chunkSize = 500;
          let saved = 0;
          for (let i = 0; i < draftRecords.length; i += chunkSize) {
            const chunk = draftRecords.slice(i, i + chunkSize);
            saved = Math.min(i + chunkSize, draftRecords.length);
            setProgressMsg(`Supabase에 시간표 반영 중... (${saved} / ${draftRecords.length}건)`);

            const { error } = await window.supabaseClient
              .from('daily_logs')
              .upsert(chunk, { onConflict: 'team,log_date,teacher,shift' });

            if (error) throw error;
          }

          setProgressMsg("저장 완료!");
          setSaving(false);
          setShowSuccessModal(true);
        } catch (err) {
          console.error(err);
          setSaving(false);
          setProgressMsg("");
          setNotice("⚠️ 시간표 저장 중 오류가 발생했습니다: " + err.message);
        }
      };

      const EXCLUDE_KEYWORDS = ["공휴일", "대체공휴일", "근로자의날", "어린이날", "현충일", "광복절", "개천절", "한글날", "석가탄신일", "부처님오신날", "성탄절", "제헌절", "추석", "설날", "신정", "선거일", "간담회", "소양교육", "자체학습", "휴가", "휴강", "준비", "자체학습"];

      const sortedTeacherNames = Object.keys(scheduleTemplates).sort((a, b) => {
        const groupA = scheduleTemplates[a].group;
        const groupB = scheduleTemplates[b].group;
        const weightA = getGroupWeight(groupA);
        const weightB = getGroupWeight(groupB);
        if (weightA !== weightB) return weightA - weightB;

        return getTeacherSortWeight(team, a) - getTeacherSortWeight(team, b);
      });

      const filteredTeachers = previewFilter === "ALL"
        ? sortedTeacherNames
        : sortedTeacherNames.filter(name => name === previewFilter);

      return (
