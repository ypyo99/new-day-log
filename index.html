    document.addEventListener("DOMContentLoaded", function () {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2563EB';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 120px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('업무', 256, 200);
      ctx.fillText('일지', 256, 360);

      const iconUrl = canvas.toDataURL('image/png');

      const manifest = {
        name: "성동노인종합복지관 디지털교육 서포터즈",
        short_name: "업무일지",
        start_url: window.location.href.split('?')[0].split('#')[0],
        display: "standalone",
        background_color: "#f9fafb",
        theme_color: "#2563EB",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
          { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
        ]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);
    });
  </script>

    function getTeacherSortWeight(team, teacher) {
      if (!TEACHER_GROUPS || !TEACHER_GROUPS[team]) return 999;
      const cleanTeacher = (teacher || "").trim().replace(/[\s\n\r]/g, "");
      const keys = Object.keys(TEACHER_GROUPS[team]);
      const idx = keys.findIndex(k => k.trim().replace(/[\s\n\r]/g, "") === cleanTeacher);
      return idx !== -1 ? idx : 999;
    }

    function getGroupWeight(group) {
      if (!group) return 99;
      if (group === "오전") return 1;
      if (group === "오후") return 2;
      const match = group.match(/(\d+)조/);
      if (match) return parseInt(match[1]);
      return 99;
    }

    function getShiftWeight(shift) {
      if (!shift) return 9999;
      const match = shift.match(/(\d+):(\d+)/);
      if (match) {
        return parseInt(match[1]) * 60 + parseInt(match[2]);
      }
      return 9999;
    }

    const teamList = ["1팀", "2팀", "3팀", "취업팀"];


    const getLocalDateString = (d) => {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const getDirectImageUrl = (url) => {
      if (!url) return '';
      let finalUrl = url.trim();
      if (finalUrl.startsWith('//')) finalUrl = 'https:' + finalUrl;
      if (finalUrl.startsWith('data:')) return finalUrl;

      // [신규] =IMAGE("URL") 형식에서 URL 추출 (더욱 견고하게 수정)
      if (finalUrl.toUpperCase().startsWith('=IMAGE(')) {
        const formulaMatch = finalUrl.match(/IMAGE\s*\(\s*["']?\s*([^"'\s,)]+)/i);
        if (formulaMatch && formulaMatch[1]) finalUrl = formulaMatch[1].replace(/["']/g, '');
      }

      let fileId = null;
      if (finalUrl.includes('drive.google.com/file/d/')) {
        const match = finalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) fileId = match[1];
      } else if (finalUrl.includes('drive.google.com/uc')) {
        const match = finalUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) fileId = match[1];
      } else if (finalUrl.includes('drive.google.com/open?id=')) {
        const match = finalUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) fileId = match[1];
      }

      if (fileId) {
        // 더 안정적이고 빠른 Google Drive 직접 링크 형식 (CORS 대응)
        return `https://lh3.googleusercontent.com/d/${fileId}=w1000`;
      }
      return finalUrl;
    };

    const getDayName = (dateStr) => {
      if (!dateStr) return '';

      return days[new Date(dateStr).getDay()];

    const formatStatusIfDate = (val) => {
      if (val === undefined || val === null) return '';
      const strVal = String(val);
      const isIso = /^\d{4}-\d{2}-\d{2}T/.test(strVal);
      const isGmt = /[a-zA-Z]{3} [a-zA-Z]{3} \d{1,2} \d{4}/.test(strVal);
      if (isIso || isGmt) {
        const d = new Date(strVal);
        if (!isNaN(d.getTime())) {
          return `${d.getMonth() + 1}/${d.getDate()}`;
        }
      }
      return strVal;
    };

    const SignaturePad = ({ onSave, disabled, currentUrl, onTriggerSave, onRefresh, isDoubleHeight, forceSign }) => {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [showSavedImg, setShowSavedImg] = useState(false);
      const [isImgLoading, setIsImgLoading] = useState(false);
      const [lastBase64, setLastBase64] = useState("");
      const [isSigning, setIsSigningState] = useState(false);
      const isSigningRef = useRef(false);
      const isChangedRef = useRef(false);
      const hasDrawnRef = useRef(false);
      const originalUrlRef = useRef("");

      const setIsSigningWithRef = (val) => {
        isSigningRef.current = val;
        setIsSigningState(val);
      };

      useEffect(() => {
        if (forceSign && !isSigningRef.current) {
          toggleSignMode();
        }
      }, [forceSign]);

      useEffect(() => {
        if (isSigningRef.current) return;
        const hasUrl = currentUrl && (currentUrl.startsWith('http') || currentUrl.startsWith('data:') || currentUrl.startsWith('=') || currentUrl.includes('drive.google.com'));
        if (hasUrl) {
          setShowSavedImg(true);
          if (currentUrl.startsWith('http') && !isImgLoading) {
            setIsImgLoading(true);
          } else {
            setLastBase64(currentUrl);
            setIsImgLoading(false);
          }
        } else {
          setShowSavedImg(false);
          setIsImgLoading(false);
        }
      }, [currentUrl, isSigning]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#000';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        }
      }, [isDoubleHeight]);

      const clearCanvasInternal = () => {
        const canvas = canvasRef.current;
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const tempWidth = canvas.width;
          canvas.width = 0;
          canvas.width = tempWidth;
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#000';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        }
      };

      useEffect(() => {
        if (currentUrl === "") {
          clearCanvasInternal();
          setLastBase64("");
        }
      }, [currentUrl]);

      const getCoordinates = (event) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if (event.touches && event.touches.length > 0) {
          clientX = event.touches[0].clientX;
          clientY = event.touches[0].clientY;
        } else {
          clientX = event.clientX;
          clientY = event.clientY;
        }
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      };

      const startDrawing = (e) => {
        if (disabled || !isSigningRef.current) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#000';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = 1.0;
        ctx.filter = 'none';
        ctx.beginPath();
        ctx.moveTo(x, y);
        setIsDrawing(true);
        isChangedRef.current = true;
      };

      const draw = (e) => {
        if (!isDrawing || disabled || !isSigningRef.current) return;
        e.preventDefault();
        const { x, y } = getCoordinates(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawing = () => {
        if (!isDrawing || disabled || !isSigningRef.current) return;
        setIsDrawing(false);
        hasDrawnRef.current = true;
        if (canvasRef.current) {
          const base64 = canvasRef.current.toDataURL('image/png');
          setLastBase64(base64);
          // 💡 [수정] 한 획이 끝날 때마다 부모 상태에 즉시 반영하여 '저장' 버튼이 활성화되도록 함
          onSave(base64);
        }
      };

      // 💡 기존 싸인을 캔버스에 로드하는 함수
      const loadSignatureToCanvas = useCallback(() => {
        const hasUrl = currentUrl && (currentUrl.startsWith('http') || currentUrl.startsWith('data:') || currentUrl.startsWith('=') || currentUrl.includes('drive.google.com'));
        if (!hasUrl) {
          setShowSavedImg(false);
          return;
        }

        const img = new Image();
        if (!currentUrl.startsWith('data:')) {
          img.crossOrigin = "anonymous";
        }

        img.onload = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');

          // 💡 [핵심] 그리기가 준비된 시점에만 캔버스를 비우고 즉시 그림
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#000';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.globalAlpha = 1.0;
          ctx.filter = 'contrast(1.3) brightness(0.95)';

          for (let i = 0; i < 4; i++) {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          }

          ctx.filter = 'none';
          hasDrawnRef.current = true;
          // 성공적으로 캔버스에 옮겨졌을 때만 오버레이를 숨김
          setShowSavedImg(false);
        };

        img.onerror = () => {
          console.error("Signature image load failed to canvas.");
          // 실패 시 오버레이를 유지하여 사용자가 기존 싸인을 볼 수 있게 함
          setShowSavedImg(true);
          setIsImgLoading(false);
        };

        const targetUrl = getDirectImageUrl(currentUrl);
        if (targetUrl.startsWith('data:')) {
          img.src = targetUrl;
        } else {
          // 캐시 충돌 방지용 파라미터 추가
          const connector = targetUrl.includes('?') ? '&' : '?';
          img.src = `${targetUrl}${connector}t=${Date.now()}`;
        }
      }, [currentUrl]);

      const toggleSignMode = () => {
        if (disabled) return;
        if (!isSigningRef.current) {
          // 💡 싸인 모드 진입
          originalUrlRef.current = currentUrl; // 원래 싸인 복원용 백업
          isChangedRef.current = false;
          hasDrawnRef.current = false;
          loadSignatureToCanvas();
          setIsSigningWithRef(true);
        } else {
          // 💡 저장 시도
          if (!isChangedRef.current) {
            // 변경 사항이 없으면 단순 종료
            setIsSigningWithRef(false);
            return;
          }

          setIsSigningWithRef(false);
          if (hasDrawnRef.current && canvasRef.current) {
            const base64 = canvasRef.current.toDataURL('image/png');
            setLastBase64(base64);
            setShowSavedImg(true);
            onSave(base64);
            if (onTriggerSave) {
              setTimeout(() => onTriggerSave(base64), 100);
            }
          } else {
            // 아무것도 그리지 않았거나 지우기를 누른 경우 삭제 처리
            setLastBase64("");
            setShowSavedImg(false);
            clearCanvasInternal();
            onSave("");
            if (onTriggerSave) {
              setTimeout(() => onTriggerSave("__DELETE__"), 100);
            }
          }
        }
      };

      const restartSign = () => {
        if (disabled) return;
        clearCanvasInternal();
        hasDrawnRef.current = false;
        isChangedRef.current = true; // 지우기도 변경으로 간주
        setShowSavedImg(false);
        // 💡 [추가] 지웠을 때도 부모 상태에 즉시 반영
        onSave("");
      };

      // ★ 원본 복구 전용 함수
      const restoreOriginal = (e, skipRefresh = false, overrideUrl = null) => {
        if (e && e.stopPropagation) e.stopPropagation();

        // 부모로부터 전달받은 데이터 갱신 함수 호출 (시트 데이터 다시 읽기)
        if (!skipRefresh && typeof onRefresh === 'function') {
          onRefresh();
        }

        setIsSigningState(false);
        isSigningRef.current = false;
        clearCanvasInternal();
        hasDrawnRef.current = false;

        const targetUrl = overrideUrl !== null ? overrideUrl : currentUrl;

        // 원본 URL 판별
        const hasUrl = targetUrl && (targetUrl.startsWith('http') || targetUrl.startsWith('data:') || targetUrl.startsWith('=') || targetUrl.includes('drive.google.com'));
        if (hasUrl) {
          setShowSavedImg(true);
          setIsImgLoading(false);
          if (targetUrl.startsWith('data:')) {
            setLastBase64(targetUrl);
          } else {
            setLastBase64("");
          }
        } else {
          setShowSavedImg(false);
          setLastBase64("");
        }
      };

      const cancelSign = () => {
        if (!isChangedRef.current) {
          setIsSigningState(false);
          isSigningRef.current = false;
          return;
        }
        // 변경 사항이 있었으나 나가는 경우, 부모 상태를 원래 싸인으로 원복
        const originalUrl = originalUrlRef.current;
        onSave(originalUrl);
        // 새로고침 없이 UI만 복구하며, 백업해둔 원래 싸인 URL로 복원 처리
        restoreOriginal(null, true, originalUrl);
      };

      const handleImgLoad = () => {
        setIsImgLoading(false);
        // 싸인 모드일 때는 캔버스 초기화 방지
        if (!isSigning) clearCanvasInternal();
      };

      const displayImgUrl = (currentUrl && (currentUrl.startsWith('http') || currentUrl.startsWith('=') || currentUrl.includes('drive.google.com')))
        ? getDirectImageUrl(currentUrl)
        : (currentUrl && currentUrl.startsWith('data:') ? currentUrl : lastBase64);

      return (
        <div className="flex flex-col items-center border border-blue-300 p-3 bg-sky-50 rounded-2xl mt-3 shadow-sm">
          <div className="flex justify-between w-full mb-2 px-1 gap-2 items-center">
            <span className={`text-blue-700 font-bold text-sm flex items-center gap-1 ${disabled ? 'opacity-30' : ''}`}>
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
              싸인
            </span>
            <div className="flex gap-1 items-center">
              {!isSigning && (
                <button
                  type="button"
                  onClick={restoreOriginal}
                  disabled={disabled}
                  title="원본 싸인 불러오기"
                  className="p-1.5 text-blue-500 hover:text-blue-700 hover:bg-blue-50 rounded-lg border border-blue-200 transition-colors active:scale-90 disabled:opacity-30 disabled:cursor-not-allowed"
                >
                  <RotateCcw className="w-5 h-5" />
                </button>
              )}
              <button
                type="button"
                onClick={toggleSignMode}
                disabled={disabled}
                className={`text-sm sm:text-[15px] font-black px-3 py-1.5 rounded-md shadow-md transition-all active:scale-95 border disabled:opacity-50 disabled:cursor-not-allowed ${isSigning ? 'bg-green-500 hover:bg-green-600 text-white border-green-600 ring-4 ring-green-100' : 'bg-blue-500 hover:bg-blue-600 text-white border-blue-600'}`}
              >
                {isSigning ? '저장' : '싸인하기'}
              </button>
              {isSigning && (
                <>
                  <button type="button" onClick={restartSign} disabled={disabled} className="text-sm sm:text-[15px] font-black text-red-600 hover:text-red-700 px-3 py-1.5 bg-white border-2 border-red-200 rounded-md shadow-sm disabled:opacity-50 transition-all active:scale-95">지우기</button>
                  <button type="button" onClick={cancelSign} className="text-sm sm:text-[15px] font-black text-gray-600 hover:text-gray-800 px-3 py-1.5 bg-white border-2 border-gray-200 rounded-md shadow-sm transition-all active:scale-95">나가기</button>
                </>
              )}
            </div>
          </div>
          <div
            className={`relative w-full max-w-[400px] group`}
            style={{ aspectRatio: isDoubleHeight ? '400 / 404' : '400 / 218' }}
          >
            <canvas
              ref={canvasRef}
              width={400}
              height={isDoubleHeight ? 404 : 218}
              className={`absolute inset-0 border ${isSigning ? 'border-blue-300 ring-4 ring-blue-50' : 'border-gray-200'} bg-sky-100 touch-none w-full h-full rounded-xl shadow-inner z-0 transition-all ${isSigning ? 'pointer-events-auto' : 'pointer-events-none'}`}
              onMouseDown={startDrawing}
              onMouseMove={draw}
              onMouseUp={stopDrawing}
              onMouseLeave={stopDrawing}
              onTouchStart={startDrawing}
              onTouchMove={draw}
              onTouchEnd={stopDrawing}
            />

            {/* 💡 [추가] 2명일 때 중앙 가이드 점선 (저장 시에는 포함되지 않음) */}
            {isSigning && isDoubleHeight && (
              <div className="absolute top-1/2 left-0 w-full border-t-2 border-dashed border-blue-400/40 pointer-events-none z-10"></div>
            )}

            {showSavedImg && displayImgUrl && (
              <div
                key={`restore-${displayImgUrl}`}
                className={`absolute inset-0 z-10 flex items-center justify-center bg-sky-100 border border-blue-300 rounded-xl shadow-inner overflow-hidden ${isSigning ? 'pointer-events-none' : ''}`}
              >
                {/* 1. 로딩 중일 때 보여줄 백그라운드 싸인 (끊김 방지) */}
                {isImgLoading && lastBase64 && (
                  <img
                    src={lastBase64}
                    alt="Background"
                    className="absolute inset-0 w-full h-full object-contain opacity-50 blur-[0.5px]"
                  />
                )}

                {/* 2. 로딩 스피너 */}
                {isImgLoading && (
                  <div className="absolute inset-0 z-30 flex items-center justify-center bg-white/40">
                    <div className="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                  </div>
                )}

                {/* 3. 실제 이미지 (crossOrigin 없이 표시 - CORS 문제 방지) */}
                <img
                  key={displayImgUrl}
                  src={displayImgUrl}
                  alt="Signature"
                  className="max-h-full max-w-full object-contain transition-opacity duration-300 opacity-100"
                  onLoad={handleImgLoad}
                  onError={() => setIsImgLoading(false)}
                />
              </div>
            )}
          </div>
        </div>
      );
    };

    // =====================================================================
    // 🖥️ 0. 선생님 명단 관리 프로그램
    // =====================================================================
    function TeacherManagementApp({ onNavigateBack }) {
      const [teachers, setTeachers] = useState([]);
      const [isEditing, setIsEditing] = useState(false);
      const [currentId, setCurrentId] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [isAdmin, setIsAdmin] = useState(false);
      const [formData, setFormData] = useState({
        team: '1팀',
        group: '1조',
        seq_num: '',
        name: '',
        shift1: '9:30~10:30',
        shift2: '10:30~11:30',
        shift3: '11:30~12:30'
      });

      const [showPwdModal, setShowPwdModal] = useState(false);
      const [pwdInput, setPwdInput] = useState("");
      const [pwdError, setPwdError] = useState(false);
      const pwdInputRef = useRef(null);

      useEffect(() => {
        if (showPwdModal && pwdInputRef.current) {
          pwdInputRef.current.focus();
        }
      }, [showPwdModal]);

      const handleAdminClick = () => {
        if (isAdmin) {
          setIsAdmin(false);
        } else {
          setShowPwdModal(true);
          setPwdInput("");
          setPwdError(false);
        }
      };

      const checkPassword = () => {
        if (pwdInput === "qqq") {
          setIsAdmin(true);
          setShowPwdModal(false);
        } else {
          setPwdError(true);
        }
      };

      const fetchTeachers = async () => {
        setIsLoading(true);
        try {
          const { data, error } = await window.supabaseClient.from('teachers').select('*').order('team').order('group_name').order('seq_num').order('name');
          if (error) throw error;
          const formatted = data.map(t => ({
            id: t.id,
            team: t.team,
            group: t.group_name || '',
            seq_num: t.seq_num || '',
            name: t.name,
            shift1: t.shift1 || '',
            shift2: t.shift2 || '',
            shift3: t.shift3 || ''
          }));
          setTeachers(formatted);
          window.localStorage.setItem('sungdong_teacher_list', JSON.stringify(formatted));
        } catch (e) {
          console.error("Error fetching teachers:", e);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchTeachers();
      }, []);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => {
          const next = { ...prev, [name]: value };
          if (name === 'team') {
            if (value === '3팀') {
              next.shift1 = '13:00~14:00';
              next.shift2 = '14:00~15:00';
              next.shift3 = '15:00~16:00';
            } else {
              next.shift1 = '9:30~10:30';
              next.shift2 = '10:30~11:30';
              next.shift3 = '11:30~12:30';
            }
          }
          return next;
        });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.name.trim()) {
          alert('이름을 입력해주세요.');
          return;
        }

        const payload = {
          team: formData.team,
          group_name: formData.group,
          seq_num: formData.seq_num ? parseInt(formData.seq_num, 10) : null,
          name: formData.name,
          shift1: formData.shift1,
          shift2: formData.shift2,
          shift3: formData.shift3
        };

        setIsLoading(true);
        try {
          if (isEditing && currentId) {
            const { error } = await window.supabaseClient.from('teachers').update(payload).eq('id', currentId);
            if (error) throw error;
          } else {
            const { error } = await window.supabaseClient.from('teachers').insert([payload]);
            if (error) throw error;
          }
          await fetchTeachers();
          const nextSeq = !isEditing && formData.seq_num ? (parseInt(formData.seq_num, 10) + 1).toString() : '';
          setFormData(prev => ({
            ...prev,
            name: '',
            seq_num: nextSeq
          }));
          setIsEditing(false);
          setCurrentId(null);
        } catch (err) {
          console.error(err);
          alert('저장에 실패했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleEdit = (teacher) => {
        setFormData({
          team: teacher.team,
          group: teacher.group,
          seq_num: teacher.seq_num || '',
          name: teacher.name,
          shift1: teacher.shift1 || '',
          shift2: teacher.shift2 || '',
          shift3: teacher.shift3 || ''
        });
        setCurrentId(teacher.id);
        setIsEditing(true);
      };

      const handleDelete = async (id) => {
        if (window.confirm('정말 삭제하시겠습니까?')) {
          setIsLoading(true);
          try {
            const { error } = await window.supabaseClient.from('teachers').delete().eq('id', id);
            if (error) throw error;
            await fetchTeachers();
          } catch (err) {
            console.error(err);
            alert('삭제에 실패했습니다.');
          } finally {
            setIsLoading(false);
          }
        }
      };

      const myTeam = getSavedItem('sungdong_team', '미선택');
      const myTeacher = getSavedItem('sungdong_teacher', '선생님');

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col font-sans pb-6">
          <header className="bg-blue-600 text-white px-4 pt-4 pb-7 shadow-lg z-40 flex justify-between items-start relative shrink-0 min-h-[96px]">
            {/* 타이틀 영역 */}
            <div className="flex items-center">
              <div className="flex flex-col">
                <div className="flex items-center mb-1">
                  <img src="Logo_of_Seoul.jpg" alt="서울시 로고" className="h-7 bg-white px-2 py-1 rounded-md object-contain mr-2" onError={(e) => e.target.style.display = 'none'} />
                  <h1 className="font-black text-xl leading-tight">성동노인종합복지관</h1>
                </div>
                <p className="text-lg font-bold text-yellow-300">디지털교육 서포터즈</p>
                <p className="text-base opacity-95 flex items-center mt-1 font-bold">
                  <User className="w-4 h-4 mr-1" /> 선생님 명단
                </p>
              </div>
            </div>

            {/* 담당자 로그인 버튼 영역 - 헤더 수직 아래 중앙 absolute 배치 */}
            <div className="absolute left-1/2 bottom-1.5 transform -translate-x-1/2 z-50">
              <button
                onClick={handleAdminClick}
                className={`px-6 py-1.5 md:px-10 md:py-2 rounded-lg border border-blue-900 font-bold transition-all active:scale-90 text-sm md:text-base touch-manipulation whitespace-nowrap ${isAdmin ? 'bg-white text-blue-800 shadow' : 'bg-blue-800 text-white hover:bg-blue-900 shadow-md'}`}
              >
                {isAdmin ? '담당자 모드 종료' : '담당자 로그인'}
              </button>
            </div>

            {/* 처음으로 버튼 영역 */}
            <button
              onClick={onNavigateBack}
              className="text-xs flex flex-col items-center font-bold p-2 rounded-lg shadow-md transition-all touch-manipulation bg-blue-800 text-white opacity-90 active:scale-95"
            >
              <Home className="w-5 h-5 mb-1" /> 처음으로
            </button>
          </header>

          <main className="flex-1 px-4 sm:px-6 md:px-8 pt-2 pb-12 w-full max-w-full lg:max-w-[95%] xl:max-w-[92%] mx-auto overflow-y-auto">
            {isAdmin ? (
              <div className="bg-white rounded-2xl shadow-md border border-gray-100 p-5 mb-6">
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 className="text-lg font-bold text-gray-800">
                      {isEditing ? '선생님 정보 수정' : '새 선생님 등록'}
                    </h2>
                    <div className="flex gap-2">
                      {isEditing && (
                        <button type="button" onClick={() => { setIsEditing(false); setCurrentId(null); setFormData({ team: '1팀', group: '1조', seq_num: '', name: '', shift1: '9:30~10:30', shift2: '10:30~11:30', shift3: '11:30~12:30' }); }} className="px-3 py-1.5 text-sm bg-gray-200 text-gray-700 font-bold rounded-lg hover:bg-gray-300 transition-colors">
                          취소
                        </button>
                      )}
                      <button type="submit" disabled={isLoading} className="px-3 py-1.5 text-sm bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50">
                        {isLoading ? '처리중...' : (isEditing ? '수정 저장' : '새로 등록')}
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2 sm:gap-4">
                    <div>
                      <select name="team" value={formData.team} onChange={handleInputChange} className="w-full border border-gray-300 rounded-lg p-1.5 sm:p-2 bg-gray-50 focus:ring-2 focus:ring-indigo-400 outline-none text-xs sm:text-base">
                        <option value="1팀">1팀</option>
                        <option value="2팀">2팀</option>
                        <option value="3팀">3팀</option>
                        <option value="취업팀">취업팀</option>
                      </select>
                    </div>
                    <div>
                      <input type="text" name="group" value={formData.group} onChange={handleInputChange} placeholder="예: 1조" className="w-full border border-gray-300 rounded-lg p-1.5 sm:p-2 bg-gray-50 focus:ring-2 focus:ring-indigo-400 outline-none text-xs sm:text-base" />
                    </div>
                    <div className="flex gap-2 sm:gap-4 w-full">
                      <input type="text" inputMode="numeric" name="seq_num" value={formData.seq_num} onChange={handleInputChange} placeholder="번호" className="w-16 border border-gray-300 rounded-lg p-1.5 sm:p-2 bg-gray-50 focus:ring-2 focus:ring-indigo-400 outline-none text-xs sm:text-base text-center" />
                      <input type="text" name="name" value={formData.name} onChange={handleInputChange} placeholder="선생님 이름" className="flex-1 min-w-0 border border-gray-300 rounded-lg p-1.5 sm:p-2 bg-gray-50 focus:ring-2 focus:ring-indigo-400 outline-none text-xs sm:text-base" />

                    {teachers.length > 0 ? teachers.sort((a, b) => a.team.localeCompare(b.team) || ((a.seq_num || 999) - (b.seq_num || 999)) || a.group.localeCompare(b.group) || a.name.localeCompare(b.name)).map(t => (
                      <tr key={t.id} className={`border-b border-gray-100 ${t.team === '2팀' || t.team === '취업팀' ? 'bg-sky-50 hover:bg-sky-100' : 'hover:bg-gray-50'}`}>

          {showPwdModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full">
                <h3 className="text-lg font-bold text-gray-800 mb-4 text-center">담당자 암호</h3>
                <input ref={pwdInputRef} autoFocus type="password" value={pwdInput} onChange={(e) => { const val = e.target.value; setPwdInput(val); if (val === 'qqq') { setIsAdmin(true); window.localStorage.setItem('sungdong_admin_logged_in', 'true'); setShowPwdModal(false); } }} onKeyDown={(e) => e.key === 'Enter' && checkPassword()} className="w-full border-2 p-3 rounded-lg mb-4 text-center text-2xl tracking-widest outline-none focus:border-blue-500 text-black" placeholder="••••" />
