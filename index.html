<!DOCTYPE html>
<html lang="ko">

<head>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-1HG9QM5KGR');

  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>성동노인종합복지관 디지털교육 서포터즈 업무일지 (통합본)</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" href="data:,">

  <script>
    window.addEventListener('error', function (e) {
      alert("⚠️ JS 오류 발생: " + e.message + "\n위치: " + e.filename + ":" + e.lineno);
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2563EB';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 120px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('업무', 256, 200);
      ctx.fillText('일지', 256, 360);

      const iconUrl = canvas.toDataURL('image/png');

      const manifest = {
        name: "성동노인종합복지관 디지털교육 서포터즈",
        short_name: "업무일지",
        start_url: window.location.href.split('?')[0].split('#')[0],
        display: "standalone",
        background_color: "#f9fafb",
        theme_color: "#2563EB",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
          { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
        ]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);
    });
  </script>
</head>

<body>
  <div id="root">
    <style>
      .initial-loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #f9fafb;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .initial-loader-spinner {
        width: 3rem;
        height: 3rem;
        border: 4px solid #2563eb;
        border-top-color: transparent;
        border-radius: 50%;
        animation: initial-loader-spin 1s linear infinite;
      }
      .initial-loader-text {
        margin-top: 1rem;
        font-size: 1.125rem;
        font-weight: 700;
        color: #4b5563;
        animation: initial-loader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes initial-loader-pulse {
        50% { opacity: .5; }
      }
    </style>
    <div class="initial-loader-container">
      <div class="initial-loader-spinner"></div>
      <p class="initial-loader-text">화면을 불러오는 중...</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (registration) {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, function (err) {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>

</html>
